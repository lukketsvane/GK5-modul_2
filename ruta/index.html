<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

// ---------------------------------------------------------------- lysmodellen (same tal som konsept/film/cad/lysmodell.py)
const FARGAR = {"graabeige": [0.4, 0.35, 0.285, "Grå-beige"], "morkegron": [0.02, 0.05, 0.033, "Mørkegrøn"], "svart": [0.011, 0.011, 0.012, "Svart"], "kirsebaer": [0.2, 0.014, 0.02, "Kirsebærraud"]}, GEO = {"X0": -0.19106882065833075, "X1": 0.10893117934166924, "U1": 0.2034, "YT": 0.022, "AKSE_H": 0.26};
const LM_PER_W = 100, INN = 0.60, NED = 0.60, OPP = 0.30, KANT = 0.10;     // stripa, inn i plata, ut undersida, ut arket, ut ved kanten
const UTE = 0.0285, KANT_B = 0.004;                                        // der ruta kjem ut av bjelken, og breidda på kantstripa (m)
const ENH = 300;                                                           // så mange cd/m² svarar til 1,0 i biletet før tonekurva
const RHO = 0.45;                                                          // kor mykje bordet kastar attende
const LYS = new THREE.Color().setRGB(1.0, 0.71, 0.43);                     // 2700 K slik kameraet ser det
const tre = (x, y, z) => new THREE.Vector3(x, z, -y);                      // CAD-en har z opp og y bakover, three.js har y opp
const t35 = 35 * Math.PI / 180, XH = new THREE.Vector3(1, 0, 0);
const UT = tre(0, -Math.cos(t35), -Math.sin(t35)), NEDOVER = tre(0, Math.sin(t35), -Math.cos(t35));
const FLATER = {                                                           // frå og til langs ruta, kva veg flata lyser, løft frå midtplanet
  ned:  { u0: UTE, u1: GEO.U1 - KANT_B, veg: NEDOVER, loft: 0.0015, del: NED },
  kant: { u0: GEO.U1 - KANT_B, u1: GEO.U1, veg: NEDOVER, loft: 0.0015, del: KANT },
  opp:  { u0: UTE, u1: GEO.U1, veg: NEDOVER.clone().negate(), loft: 0.0017, del: OPP }
};
for (const f of Object.values(FLATER)) { f.b = GEO.X1 - GEO.X0; f.h = f.u1 - f.u0; f.areal = f.b * f.h; }
const luminans = (watt, f) => watt * LM_PER_W * INN * f.del / (Math.PI * f.areal);      // cd/m² for ei matt flate

// Lux i eit punkt frå ein matt, lysande firkant: E = L/2 · Σ γ · (n · Γ). Eksakt, utan strålesporing.
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _k = new THREE.Vector3(), _v = [0, 1, 2, 3].map(() => new THREE.Vector3());
function lux(p, n, hjorne, L) {
  for (let i = 0; i < 4; i++) _v[i].subVectors(hjorne[i], p).normalize();
  let s = 0;
  for (let i = 0; i < 4; i++) {
    _a.copy(_v[i]); _b.copy(_v[(i + 1) % 4]); _k.crossVectors(_a, _b); const l = _k.length();
    if (l > 1e-9) s += Math.acos(Math.max(-1, Math.min(1, _a.dot(_b)))) * n.dot(_k) / l;
  }

// ---------------------------------------------------------------- scena
const lerret = document.getElementById('lerret');
const renderer = new THREE.WebGLRenderer({ canvas: lerret, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.AgXToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
RectAreaLightUniformsLib.init();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const kamera = new THREE.PerspectiveCamera(22, 1, 0.05, 30);
const styr = new OrbitControls(kamera, lerret);
styr.enableDamping = true; styr.dampingFactor = 0.09; styr.enablePan = false; styr.minDistance = 0.5; styr.maxDistance = 3.4; styr.rotateSpeed = 0.7;

// bordet: lyset blir rekna i kvar piksel med same formel som lux() over
const OPP_N = new THREE.Vector3(0, 1, 0);
const bordU = { n: { value: [0, 1, 2, 3].map(() => new THREE.Vector3()) }, k: { value: [0, 1, 2, 3].map(() => new THREE.Vector3()) }, o: { value: [0, 1, 2, 3].map(() => new THREE.Vector3()) },
  nn: { value: new THREE.Vector3() }, no: { value: new THREE.Vector3() }, L: { value: new THREE.Vector3() }, farge: { value: LYS }, rho: { value: RHO }, enh: { value: ENH }, synleg: { value: 0 } };
const bord = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShaderMaterial({ uniforms: bordU,
  vertexShader: 'varying vec3 vP; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: `
    varying vec3 vP; uniform vec3 n[4]; uniform vec3 k[4]; uniform vec3 o[4]; uniform vec3 nn; uniform vec3 no; uniform vec3 L; uniform vec3 farge; uniform float rho; uniform float enh; uniform float synleg;
    float ledd(vec3 a, vec3 b) { vec3 c = cross(a, b); float l = length(c); return l < 1e-7 ? 0.0 : acos(clamp(dot(a, b), -1.0, 1.0)) * c.y / l; }
    float firkant(vec3 h[4], float lum) { vec3 a = normalize(h[0] - vP), b = normalize(h[1] - vP), c = normalize(h[2] - vP), d = normalize(h[3] - vP);
      return 0.5 * lum * abs(ledd(a, b) + ledd(b, c) + ledd(c, d) + ledd(d, a)); }
    void main() {
      float E = 0.0;                                                        // lux
      if (dot(vP - n[0], nn) > 0.0) E += firkant(n, L.x) + firkant(k, L.y);
      if (dot(vP - o[0], no) > 0.0) E += firkant(o, L.z);
      vec3 farg = farge * (rho * E / 3.14159265 / enh);                     // lysstyrken til bordet, i same eining som resten av biletet
      float line = 0.0, w = fwidth(E) * 1.2;                                // liner ved 50, 100, 200 og 400 lux
      line = max(line, 1.0 - smoothstep(0.0, w, abs(E - 50.0))); line = max(line, 1.0 - smoothstep(0.0, w, abs(E - 100.0)));
      line = max(line, 1.0 - smoothstep(0.0, w, abs(E - 200.0))); line = max(line, 1.0 - smoothstep(0.0, w, abs(E - 400.0)));
      farg += vec3(0.11) * line;
      gl_FragColor = vec4(farg * synleg, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }` }));
bord.rotation.x = -Math.PI / 2; bord.visible = false; scene.add(bord);

// ---------------------------------------------------------------- tilstand
const M = {
  lampe:    { min: 0, max: 80, steg: 1, kva: 'helling', start: 35, merke: v => 'Helling ' + Math.round(v) + '°', namn: 'Helling', bane: [-32, 10, 1.75], maal: [-0.03, 0.075, 0.05], rom: 0.42 },
  mekanikk: { min: 0, max: 100, steg: 1, kva: 'opna', start: 100, merke: v => v < 0.5 ? 'Samla' : 'Opna ' + Math.round(v) + ' %', namn: 'Opne lampa', bane: [-38, 16, 2.35], maal: [-0.03, -0.03, 0.03], rom: 0.42 },
  lys:      { min: 0.25, max: 3, steg: 0.05, kva: 'watt', start: 2, merke: v => v.toFixed(1).replace('.', ',') + ' W · ' + Math.round(v * LM_PER_W) + ' lm', namn: 'Effekt', bane: [-30, 26, 2.2], maal: [-0.03, 0.05, 0.07], rom: 0.012 }
};
let modus = 'lampe', farge = 'graabeige', skitten = true, flyr = false, sist = 0, klar = false, klarMs = 0, teikna = false, treg = 0;
const no = { helling: 35, opna: 0, watt: 2, rom: 0.42, bord: 0 }, vil = { helling: 35, opna: 0, watt: 2, rom: 0.42, bord: 0 };
const kamVil = { pos: new THREE.Vector3(), maal: new THREE.Vector3() };
const glidar = document.getElementById('glidar'), verdi = document.getElementById('verdi'), tekst = document.getElementById('tekst');
function bane(b, m) { const az = b[0] * Math.PI / 180, el = b[1] * Math.PI / 180; kamVil.maal.set(m[0], m[1], m[2]);
  kamVil.pos.set(m[0] + b[2] * Math.sin(az) * Math.cos(el), m[1] + b[2] * Math.sin(el), m[2] + b[2] * Math.cos(az) * Math.cos(el)); }
bane(M.lampe.bane, M.lampe.maal); kamera.position.copy(kamVil.pos); styr.target.copy(kamVil.maal);

let mixer, vipp, opne, mat = {}, rigg = {}, kantlist;
function oppdater() {                                                       // alt som følgjer av tilstanden: stilling, lysstyrkar, bordet, tala
  if (!mixer) return;
  vipp.time = (1 + no.helling) / 24; opne.time = (101 + 0.6 * no.opna) / 24; mixer.update(0);
  const L = {}; for (const [k, f] of Object.entries(FLATER)) L[k] = luminans(no.watt, f);
  for (const k of ['ned', 'kant', 'opp']) rigg[k].lys.intensity = L[k] / ENH;
  mat.Akryl.emissiveIntensity = L.ned / ENH; mat.Ark.emissiveIntensity = L.opp / ENH; kantlist.material.color.copy(LYS).multiplyScalar(L.kant / ENH);
  scene.environmentIntensity = no.rom; bordU.synleg.value = no.bord; bord.visible = no.bord > 0.002; bordU.L.value.set(L.ned, L.kant, L.opp);
  scene.updateMatrixWorld(true);
  for (const [k, u] of [['ned', bordU.n], ['kant', bordU.k], ['opp', bordU.o]]) {
    const r = rigg[k], b = r.f.b / 2, h = r.f.h / 2; [[-b, -h], [b, -h], [b, h], [-b, h]].forEach((c, i) => r.lys.localToWorld(u.value[i].set(c[0], c[1], 0)));
  }
  bordU.nn.value.set(0, 0, -1).transformDirection(rigg.ned.lys.matrixWorld); bordU.no.value.set(0, 0, -1).transformDirection(rigg.opp.lys.matrixWorld);
  if (modus === 'lys') { const s = Math.round(luxBord(midtUnder())) + ' lx på bordet rett under ruta · liner ved 400, 200, 100 og 50 lx · rekna, ikkje målt'; if (s !== tekst.textContent) tekst.textContent = s; }
}
function luxBord(p) {                                                       // p er eit punkt på bordet. Same sum som i skyggjaren
  const u = bordU, L = u.L.value; let E = 0;
  if (_k.subVectors(p, u.n.value[0]).dot(u.nn.value) > 0) E += lux(p, OPP_N, u.n.value, L.x) + lux(p, OPP_N, u.k.value, L.y);
  if (_k.subVectors(p, u.o.value[0]).dot(u.no.value) > 0) E += lux(p, OPP_N, u.o.value, L.z);
  return E;
}
const _m = new THREE.Vector3();
function midtUnder() { _m.set(0, 0, 0); bordU.o.value.forEach(h => _m.add(h)); _m.multiplyScalar(0.25); _m.y = 0; return _m; }

function vis() { const d = M[modus], v = +glidar.value; vil[d.kva] = v; verdi.textContent = d.merke(v);
  glidar.style.setProperty('--fyll', (100 * (v - d.min) / (d.max - d.min)) + '%'); skitten = true; }
function byt(m) {
  modus = m; const d = M[m];
  document.querySelectorAll('[data-modus]').forEach(b => b.setAttribute('aria-pressed', b.dataset.modus === m));
  glidar.min = d.min; glidar.max = d.max; glidar.step = d.steg; glidar.setAttribute('aria-label', d.namn);
  glidar.value = m === 'mekanikk' ? d.start : vil[d.kva];
  vil.opna = m === 'mekanikk' ? +glidar.value : 0; vil.rom = d.rom; vil.bord = m === 'lys' ? 1 : 0;
  styr.maxPolarAngle = m === 'lys' ? 1.5 : 1.9; tekst.textContent = '';
  bane(d.bane, d.maal); flyr = true; vis();
}

function steg(tid) {
  requestAnimationFrame(steg);
  const raa = (tid - sist) / 1000, dt = Math.min(0.05, raa || 0.016); sist = tid;
  let endra = false; const f = 1 - Math.exp(-dt / 0.085);
  for (const k in vil) { const d = vil[k] - no[k]; if (Math.abs(d) > 1e-4) { no[k] += Math.abs(d) < 1e-3 ? d : d * f; endra = true; } }
  if (flyr) { const g = 1 - Math.exp(-dt / 0.22); kamera.position.lerp(kamVil.pos, g); styr.target.lerp(kamVil.maal, g);
    if (kamera.position.distanceToSquared(kamVil.pos) < 1e-6) flyr = false; endra = true; }
  if (endra) oppdater();
  const skal = styr.update() || endra || skitten;
  if (skal) { renderer.render(scene, kamera); skitten = false; if (klar) lerret.classList.add('klar');
    // held ikkje maskina følgje (under 25 bilete i sekundet ti gonger på rad), blir biletet teikna med færre punkt. Lange opphald er ei fane i bakgrunnen og tel ikkje
    if (teikna && raa > 0.040 && raa < 0.12) { if (++treg >= 10 && renderer.getPixelRatio() > 1) { renderer.setPixelRatio(Math.max(1, renderer.getPixelRatio() - 0.5)); storleik(); treg = 0; } } else treg = 0; }

}
function storleik() { const b = innerWidth, h = innerHeight; renderer.setSize(b, h, false); kamera.aspect = b / h; kamera.fov = b < h ? 34 : 22; kamera.updateProjectionMatrix(); skitten = true; }
addEventListener('resize', storleik); storleik();
styr.addEventListener('start', () => { flyr = false; });

// ---------------------------------------------------------------- modellen
const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/'); draco.preload();   // hentar utpakkaren medan modellen er på veg
new GLTFLoader().setDRACOLoader(draco).load('3d/ruta-studio.glb', g => {
  const f = FARGAR[farge], S = (o) => new THREE.MeshStandardMaterial(o), c = (r, gg, b) => new THREE.Color().setRGB(r, gg, b);
  mat = { Lakk: S({ color: c(f[0], f[1], f[2]), roughness: 0.56 }), Leidning: S({ color: c(f[0], f[1], f[2]), roughness: 0.9 }),
    Messing: S({ color: c(0.78, 0.52, 0.20), metalness: 1, roughness: 0.27 }), Staal: S({ color: c(0.50, 0.50, 0.52), metalness: 1, roughness: 0.4 }),
    Alu: S({ color: c(0.72, 0.72, 0.74), metalness: 1, roughness: 0.35 }), Skrue: S({ color: c(0.02, 0.02, 0.02), metalness: 0.6, roughness: 0.5 }),
    Pute: S({ color: c(0.012, 0.012, 0.013), roughness: 0.85 }), Stripe: S({ color: c(1, 0.9, 0.7), emissive: LYS, emissiveIntensity: 2.2, roughness: 0.5 }),
    Akryl: S({ color: c(0.02, 0.02, 0.02), roughness: 0.18, emissive: LYS }), Ark: S({ color: c(0.03, 0.03, 0.03), roughness: 0.34, emissive: LYS }) };
  let blad;
  g.scene.traverse(o => { if (o.name === 'Blad') blad = o; if (o.isMesh && mat[o.material.name]) o.material = mat[o.material.name]; });
  // dei tre lysande flatene følgjer bladet: éi lysflate kvar, og ei list som viser kanten
  for (const [k, fl] of Object.entries(FLATER)) {
    const lys = new THREE.RectAreaLight(LYS, 1, fl.b, fl.h), z = fl.veg.clone().negate(), y = new THREE.Vector3().crossVectors(z, XH).normalize();
    lys.position.set((GEO.X0 + GEO.X1) / 2, 0, 0).addScaledVector(UT, (fl.u0 + fl.u1) / 2).addScaledVector(fl.veg, fl.loft);
