<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<title>Sluse × Uttrekk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
/* Layout: éin skjerm, ingenting rullar. Scena fyller alt; ei rad tynne strekar nedst er scrubben. Reint svart. */
:root {
  --bg: #000000;
  --tick: 255, 255, 255;
  --hot: 255, 255, 255;
  color-scheme: dark;
}
html, body {
  height: 100%; margin: 0; background: var(--bg); overflow: hidden;
  overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); cursor: grab; touch-action: none; }
#scene:active { cursor: grabbing; }
#scrub {
  position: fixed; left: 0; right: 0; bottom: 0; height: 72px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  touch-action: none; cursor: ew-resize; outline: none;
}
#ticks { display: block; width: 100%; height: 72px; }
#scrub { z-index: 2; }
#ground {
  position: fixed; left: 0; bottom: 0; z-index: 3; margin: 0; padding: 0; border: 0; border-radius: 0;
  width: calc(68px + env(safe-area-inset-left, 0px)); height: calc(68px + env(safe-area-inset-bottom, 0px));
  background: transparent; opacity: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
#ground:focus-visible { opacity: 1; outline: 1px solid rgba(255, 255, 255, 0.35); outline-offset: -6px; }
#scrub:focus-visible #ticks { filter: drop-shadow(0 0 4px rgba(var(--hot), 0.5)); }
.nogl { position: fixed; inset: 0; display: grid; place-items: center; color: rgba(var(--tick), 0.5); font: 15px/1.4 system-ui, sans-serif; padding: 24px; text-align: center; }
</style>
<meta name="description" content="Sluse × Uttrekk: interaktiv 3D-modell av lampa. GK5 modul 2, AHO.">
</head>
<body>
<canvas id="scene" role="img" aria-label="3D-modell av lampa Sluse × Uttrekk. Dra for å snu. Hald inne Shift for å låse visinga rett mot næraste side."></canvas>
<button id="ground" type="button" aria-label="Underlag: Eik. Trykk for å byte."></button>
<div id="scrub" role="slider" tabindex="0" aria-label="Stilling, frå låg til høg" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25"><canvas id="ticks" aria-hidden="true"></canvas></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("scene");
  var scrub = document.getElementById("scrub");
  var ticks = document.getElementById("ticks");
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // no page zoom or scroll (iOS ignores user-scalable for pinch, so block the gestures)
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });


  // ---------- timeline (lengths in cm, angles in degrees) ----------
  var S = 0.25, sGoal = 0.25;
  var hm = /^#s(\d(?:\.\d+)?)$/.exec(location.hash); if (hm) S = sGoal = Math.min(1, parseFloat(hm[1]));
  var E_MOOD = 5, E_FULL = 34.8;
  function seg(s, a, b) { var t = Math.min(1, Math.max(0, (s - a) / (b - a))); return t * t * (3 - 2 * t); }
  function pose(s) {
    var e = seg(s, 0, 0.2) * E_MOOD + seg(s, 0.55, 0.78) * (E_FULL - E_MOOD);
    var theta = seg(s, 0.3, 0.55) * 90;
    var phiN = seg(s, 0.78, 1);
    var mood = Math.min(1, e / E_MOOD) * (1 - phiN);
    var task = seg(s, 0.84, 1);
    return { e: e, theta: theta, phi: phiN * 90, mood: mood, task: task };
  }
  function phaseText(s) {
    if (s < 0.015) return "Av";
    if (s <= 0.3) return "Stemning, enden av skuffen gløder";
    if (s < 0.55) return "Boksen tippar opp om hengslet";
    if (s < 0.78) return "Skuffen glir ut av søyla";
    if (s < 0.995) return "Armen svingar fram over bordet";
    return "Arbeid, lys ned på bordet";
  }

  // ---------- scrub: a row of hairlines; the ones near the position rise and warm up ----------
  var tctx = ticks.getContext("2d"), tW = 0, tH = 72, tPR = 1, ML = 80, MR = 28;
  function sizeTicks() {
    tPR = Math.min(window.devicePixelRatio || 1, 3);
    tW = ticks.clientWidth;
    ticks.width = Math.round(tW * tPR); ticks.height = Math.round(tH * tPR);
    drawTicks();
  }
  function drawTicks() {
    if (!tW) return;
    tctx.setTransform(tPR, 0, 0, tPR, 0, 0);
    tctx.clearRect(0, 0, tW, tH);
    var span = tW - ML - MR, step = tW < 500 ? 49 : 63, n = Math.max(4, Math.round(span / step)), px = ML + S * span, gap = span / n;
    for (var i = 0; i <= n; i++) {
      var x = ML + span * i / n, d = (x - px) / (gap * 0.9), k = Math.exp(-d * d);
      var h = 5 + 9 * k, a = 0.28 + 0.6 * k;                       // stubs that only just reach into the view
      var w = k > 0.6 ? 1.5 : 1;
      tctx.fillStyle = "rgba(" + getTick() + "," + a.toFixed(3) + ")";
      tctx.fillRect(Math.round(x * tPR) / tPR - w / 2, tH - h, w, h);
    }
  }
  var cssVars = getComputedStyle(document.documentElement);
  function getTick() { return (cssVars.getPropertyValue("--tick") || "236, 232, 225").trim(); }
  function getHot() { return (cssVars.getPropertyValue("--hot") || "242, 196, 122").trim(); }
  function sFromX(clientX) {
    var r = ticks.getBoundingClientRect();
    return Math.min(1, Math.max(0, (clientX - r.left - ML) / (r.width - ML - MR)));
  }
  var scrubbing = false;
  scrub.addEventListener("pointerdown", function (ev) {
    scrubbing = true; try { scrub.setPointerCapture(ev.pointerId); } catch (e) {} sGoal = sFromX(ev.clientX); kick();
  });
  scrub.addEventListener("pointermove", function (ev) { if (!scrubbing) return; sGoal = sFromX(ev.clientX); kick(); });
  function endScrub() { scrubbing = false; kick(); }
  scrub.addEventListener("pointerup", endScrub);
  scrub.addEventListener("pointercancel", endScrub);
  scrub.addEventListener("keydown", function (ev) {
    var d = { ArrowRight: 0.025, ArrowUp: 0.025, ArrowLeft: -0.025, ArrowDown: -0.025, PageUp: 0.1, PageDown: -0.1 }[ev.key];
    if (ev.key === "Home") { sGoal = 0; } else if (ev.key === "End") { sGoal = 1; } else if (!d) return; else sGoal = Math.min(1, Math.max(0, sGoal + d));
    ev.preventDefault(); kick();
  });
  function updateAria() {
    scrub.setAttribute("aria-valuenow", String(Math.round(S * 100)));
    scrub.setAttribute("aria-valuetext", phaseText(S));
  }

  var renderer = null;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" }); }
  catch (err) {
    var msg = document.createElement("div"); msg.className = "nogl";
    msg.textContent = "3D-modellen kan ikkje visast i denne nettlesaren.";
    document.body.appendChild(msg);
  }
  var running = false, needsUpdate = true;
  function kick() { if (!running) { running = true; requestAnimationFrame(frame); } }   // keep drawing: camera, light, settling
  function kickPose() { needsUpdate = true; kick(); }   // the lamp or the ground changed: pose, shadows and reflections again
  if (!renderer) {
    // still let the scrub move without 3D
    var frame = function () { S += (sGoal - S) * 0.3; if (Math.abs(sGoal - S) < 0.0005) S = sGoal; drawTicks(); updateAria(); if (S !== sGoal) requestAnimationFrame(frame); else running = false; };
    window.addEventListener("resize", sizeTicks); sizeTicks(); updateAria();
    return;
  }

  // ---------- renderer ----------
  var isPhone = Math.min(screen.width, screen.height) < 600;
  var maxPR = 2;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxPR));
  renderer.physicallyCorrectLights = true;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.Fog(0x000000, 200, 460);
  var camera = new THREE.PerspectiveCamera(28, 1, 1, 3000);

  // ---------- procedural textures ----------
  var seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function makeCanvas(w, h, draw) { var c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); return c; }
  function tex(c, srgb, rep) {
    var t = new THREE.CanvasTexture(c);
    if (srgb) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
    return t;
  }

  // ---------- woods: growth rings from value noise, plank seams, pores, rays. Colour + grey height map in one pass ----------
  var OW = isPhone ? 1536 : 2048, OH = OW / 2;
  var WOODS = [
    { name: "Eik", early: [164, 116, 72], late: [94, 62, 34], ring: 26, lateAt: 0.62, wave: 0.18, planks: 5, pores: 2.2, pore: "rgba(40,22,10,0.30)", poreH: "rgba(20,20,20,0.6)", rays: 140, ray: "rgba(205,160,110,0.22)", edge: 0x3e2614, coat: 0.22, seed: 11 },
    { name: "Valnøtt", early: [108, 72, 50], late: [66, 43, 30], ring: 19, lateAt: 0.58, wave: 0.3, planks: 4, pores: 1.3, pore: "rgba(22,13,9,0.34)", poreH: "rgba(30,30,30,0.5)", rays: 0, edge: 0x24170f, coat: 0.4, seed: 23 },
    { name: "Ask", early: [218, 199, 166], late: [170, 141, 100], ring: 21, lateAt: 0.56, wave: 0.14, planks: 5, pores: 2.8, pore: "rgba(112,86,54,0.32)", poreH: "rgba(40,40,40,0.55)", rays: 0, edge: 0xa08866, coat: 0.16, seed: 37 },
    { name: "Røykt eik", early: [104, 78, 56], late: [46, 32, 22], ring: 26, lateAt: 0.6, wave: 0.18, planks: 5, pores: 2.2, pore: "rgba(14,9,5,0.36)", poreH: "rgba(20,20,20,0.6)", rays: 140, ray: "rgba(150,116,82,0.2)", edge: 0x21160f, coat: 0.28, seed: 53 }
  ];
  function buildWood(W) {
    if (W.map) return W;
    seed = W.seed;
    var G = 64, grid = new Float32Array(G * G);
    for (var i = 0; i < grid.length; i++) grid[i] = rnd();
    function vn(x, y) {
      var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      var x0 = ((xi % G) + G) % G, y0 = ((yi % G) + G) % G, x1 = (x0 + 1) % G, y1 = (y0 + 1) % G;
      var a = grid[y0 * G + x0], b = grid[y0 * G + x1], c = grid[y1 * G + x0], d = grid[y1 * G + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    var cC = document.createElement("canvas"), cH = document.createElement("canvas");
    cC.width = cH.width = OW; cC.height = cH.height = OH;
    var gc = cC.getContext("2d"), gh = cH.getContext("2d");
    var ic = gc.createImageData(OW, OH), ih = gh.createImageData(OW, OH), dc = ic.data, dh = ih.data;
    var P = W.planks, plankTone = [], plankShift = [], e = W.early, l = W.late, span = 1 - W.lateAt;
    for (var p = 0; p < P; p++) { plankTone.push(0.9 + rnd() * 0.18); plankShift.push(rnd() * 40); }
    for (var y = 0; y < OH; y++) {
      var vy = y / OH, pl = Math.min(P - 1, Math.floor(vy * P)), local = vy * P - pl;
      for (var x = 0; x < OW; x++) {
        var ux = x / OW;
        var n = vn(ux * 5 + plankShift[pl], local * 1.6) * 0.6 + vn(ux * 13, local * 4) * 0.3 + vn(ux * 40, local * 9) * 0.1;
        var heart = 0.5 + Math.sin(ux * 5.5 + plankShift[pl]) * W.wave + (n - 0.5) * 0.35;
        var r = Math.abs(local - heart) * W.ring + n * 2.2 + Math.pow(Math.abs(ux - 0.5) * 2, 2) * 1.5;
        var f = r - Math.floor(r);
        var late = f < W.lateAt ? 0 : Math.min(1, (f - W.lateAt) / (span * 0.8));
        late = late * late * (3 - 2 * late);
        var fine = vn(ux * 900, local * 60 + pl * 7), streak = vn(ux * 60, local * 220);
        var tone = plankTone[pl] * (0.9 + 0.16 * fine + 0.08 * streak);
        var seam = local < 0.004 || local > 0.996 ? 0.45 : 1;
        var o = (y * OW + x) * 4;
        dc[o] = (e[0] - (e[0] - l[0]) * late) * tone * seam;
        dc[o + 1] = (e[1] - (e[1] - l[1]) * late) * tone * seam;
        dc[o + 2] = (e[2] - (e[2] - l[2]) * late) * tone * seam;
        dc[o + 3] = 255;
        var hgt = (150 - 70 * late + 30 * (fine - 0.5)) * seam;
        dh[o] = dh[o + 1] = dh[o + 2] = hgt; dh[o + 3] = 255;
      }
    }
    gc.putImageData(ic, 0, 0); gh.putImageData(ih, 0, 0);
    for (var k = 0; k < OW * W.pores; k++) {
      var px = rnd() * OW, py = rnd() * OH, len = 3 + rnd() * 12;
      gc.fillStyle = W.pore; gc.fillRect(px, py, len, 0.8);
      gh.fillStyle = W.poreH; gh.fillRect(px, py, len, 0.8);
    }
    for (var m = 0; m < W.rays; m++) {
      var rx = rnd() * OW, ry = rnd() * OH, rl = 6 + rnd() * 26;
      gc.fillStyle = W.ray; gc.fillRect(rx, ry, rl, 1.4);
    }
    W.map = tex(cC, true); W.bump = tex(cH, false);
    return W;
  }
  buildWood(WOODS[0]);

  var peel = tex(makeCanvas(256, 256, function (g, w, h) {
    g.fillStyle = "#808080"; g.fillRect(0, 0, w, h);
    for (var i = 0; i < 2200; i++) { var r = 2 + rnd() * 6, v = Math.floor(100 + rnd() * 56); g.fillStyle = "rgba(" + v + "," + v + "," + v + ",0.18)"; g.beginPath(); g.arc(rnd() * w, rnd() * h, r, 0, Math.PI * 2); g.fill(); }
  }), false, [0.18, 0.18]);
  var brushed = tex(makeCanvas(512, 64, function (g, w, h) {
    for (var x = 0; x < w; x++) { var v = Math.floor(118 + (rnd() - 0.5) * 70); g.fillStyle = "rgb(" + v + "," + v + "," + v + ")"; g.fillRect(x, 0, 1, h); }
  }), false, [0.35, 0.02]);
  var opalGlow = tex(makeCanvas(256, 256, function (g, w, h) {
    var gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.62);
    gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.55, "#d6cdbf"); gr.addColorStop(1, "#7d7468");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }), true);
  var aoTex = tex(makeCanvas(256, 256, function (g, w, h) {
    var gr = g.createRadialGradient(w / 2, h / 2, w * 0.16, w / 2, h / 2, w * 0.5);
    gr.addColorStop(0, "rgba(0,0,0,0.92)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }), false);
  var haloTex = tex(makeCanvas(256, 256, function (g, w, h) {
    var gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, "rgba(255,210,150,0.85)"); gr.addColorStop(0.16, "rgba(255,176,104,0.32)");
    gr.addColorStop(0.5, "rgba(255,146,76,0.07)"); gr.addColorStop(1, "rgba(255,140,70,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }), true);

  // ---------- materials ----------
  var M = {
    lacquer: new THREE.MeshPhysicalMaterial({ color: 0x5a1216, roughness: 0.38, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 1.6 }),
    plinth: new THREE.MeshPhysicalMaterial({ color: 0x4a0f13, roughness: 0.46, metalness: 0, clearcoat: 0.8, clearcoatRoughness: 0.14, envMapIntensity: 1.4 }),
    alu: new THREE.MeshStandardMaterial({ color: 0xd9d7d1, metalness: 0.92, roughness: 0.74, roughnessMap: brushed, envMapIntensity: 1.6 }),
    rail: new THREE.MeshStandardMaterial({ color: 0xb4b3ae, metalness: 1, roughness: 0.22, envMapIntensity: 1.4 }),
    steel: new THREE.MeshStandardMaterial({ color: 0x9c9a95, metalness: 1, roughness: 0.18, envMapIntensity: 1.5 }),
    rubber: new THREE.MeshStandardMaterial({ color: 0x0e0d0c, roughness: 0.92, envMapIntensity: 0.4 }),
    cord: new THREE.MeshStandardMaterial({ color: 0x2a2521, roughness: 0.85, envMapIntensity: 0.3 }),
    opalEnd: new THREE.MeshStandardMaterial({ color: 0xefe9df, roughness: 0.35, emissive: 0xffb06a, emissiveMap: opalGlow, emissiveIntensity: 0, envMapIntensity: 0.3 }),
    opalRim: new THREE.MeshStandardMaterial({ color: 0xd8d2c8, roughness: 0.4, emissive: 0xffa860, emissiveIntensity: 0, envMapIntensity: 0.3 }),
    opalBottom: new THREE.MeshStandardMaterial({ color: 0xefe9df, roughness: 0.35, emissive: 0xffcf98, emissiveMap: opalGlow, emissiveIntensity: 0, envMapIntensity: 0.3 }),
    wood: new THREE.MeshPhysicalMaterial({ map: WOODS[0].map, bumpMap: WOODS[0].bump, bumpScale: 0.05, roughnessMap: WOODS[0].bump, roughness: 1.0, metalness: 0, clearcoat: 0.22, clearcoatRoughness: 0.3, envMapIntensity: 0 }),
    woodEdge: new THREE.MeshStandardMaterial({ color: 0x3e2614, roughness: 0.72, envMapIntensity: 0 })
  };

  // ---------- geometry helpers ----------
  function rrPath(P, w, h, r, cx, cy) {
    var x = cx - w / 2, y = cy - h / 2;
    P.moveTo(x + r, y); P.lineTo(x + w - r, y); P.quadraticCurveTo(x + w, y, x + w, y + r);
    P.lineTo(x + w, y + h - r); P.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    P.lineTo(x + r, y + h); P.quadraticCurveTo(x, y + h, x, y + h - r);
    P.lineTo(x, y + r); P.quadraticCurveTo(x, y, x + r, y);

  }
  // average the flat side-wall normals that meet within a crease angle, so rounded corners and bevels reflect smoothly
  function smoothSides(g, creaseDeg) {
    var grp = g.groups && g.groups[1]; if (!grp) return g;
    var pos = g.attributes.position.array, nrm = g.attributes.normal.array, src = nrm.slice();
    var cosC = Math.cos(creaseDeg * Math.PI / 180), map = {}, i, j, key;
    for (i = grp.start; i < grp.start + grp.count; i++) {
      key = Math.round(pos[3 * i] * 1000) + "," + Math.round(pos[3 * i + 1] * 1000) + "," + Math.round(pos[3 * i + 2] * 1000);
      (map[key] || (map[key] = [])).push(i);
    }
    for (key in map) {
      var ids = map[key];
      for (i = 0; i < ids.length; i++) {
        var a = ids[i], ax = src[3 * a], ay = src[3 * a + 1], az = src[3 * a + 2], sx = 0, sy = 0, sz = 0;
        for (j = 0; j < ids.length; j++) {
          var c = ids[j], cx = src[3 * c], cy2 = src[3 * c + 1], cz = src[3 * c + 2];
          if (ax * cx + ay * cy2 + az * cz >= cosC) { sx += cx; sy += cy2; sz += cz; }
        }
        var l = Math.hypot(sx, sy, sz) || 1;
        nrm[3 * a] = sx / l; nrm[3 * a + 1] = sy / l; nrm[3 * a + 2] = sz / l;
      }
    }
    g.attributes.normal.needsUpdate = true;
    return g;
  }
  function barX(w, h, r, cy, x0, len, bevel, holeInset) {
    var sh = rrPath(new THREE.Shape(), w, h, r, 0, cy);
    if (holeInset) sh.holes.push(rrPath(new THREE.Path(), w - 2 * holeInset, h - 2 * holeInset, Math.max(0.05, r - holeInset), 0, cy));
    var b = bevel || 0;
    var g = new THREE.ExtrudeGeometry(sh, { depth: len - 2 * b, bevelEnabled: b > 0, bevelThickness: b, bevelSize: b * 0.8, bevelOffset: -b * 0.8, bevelSegments: 3, curveSegments: 10 });
    g.translate(0, 0, b); g.rotateY(Math.PI / 2); g.translate(x0, 0, 0);
    return smoothSides(g, 42);
  }
  function plateY(len, wz, r, x0, y0, t, bevel) {
    var sh = rrPath(new THREE.Shape(), len, wz, r, x0 + len / 2, 0);
    var b = bevel || 0;
    var g = new THREE.ExtrudeGeometry(sh, { depth: t - 2 * b, bevelEnabled: b > 0, bevelThickness: b, bevelSize: b * 0.8, bevelOffset: -b * 0.8, bevelSegments: 3, curveSegments: 12 });
    g.translate(0, 0, b); g.rotateX(-Math.PI / 2); g.translate(0, y0, 0);
    return smoothSides(g, 42);
  }
  function mesh(geo, mat, parent, cast, receive) {
