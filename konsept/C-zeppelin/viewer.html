<script>
const data=JSON.parse(document.getElementById('scene-data').textContent);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.75;
document.getElementById('view').appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(31,innerWidth/innerHeight,1,3500);
camera.up.set(0,0,1);
const target=new THREE.Vector3(0,0,118);
let yaw=-1.12,elevation=.18,radius=700;
function updateCamera(){
 camera.position.set(radius*Math.cos(elevation)*Math.cos(yaw),radius*Math.cos(elevation)*Math.sin(yaw),118+radius*Math.sin(elevation));
 camera.lookAt(target);
}
updateCamera();
scene.add(new THREE.AmbientLight(0xd8dce8,.16));
const key=new THREE.DirectionalLight(0xffffff,1.05);key.position.set(240,-400,600);scene.add(key);
const fill=new THREE.DirectionalLight(0xb3c3d7,.55);fill.position.set(-300,140,270);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,.38);rim.position.set(0,450,190);scene.add(rim);
const material={
 matte:new THREE.MeshStandardMaterial({color:0x707276,metalness:.18,roughness:.69,side:THREE.DoubleSide}),
 frame:new THREE.MeshStandardMaterial({color:0x26272b,metalness:.34,roughness:.64,side:THREE.DoubleSide}),
 metal:new THREE.MeshStandardMaterial({color:0x505259,metalness:.4,roughness:.45,side:THREE.DoubleSide}),
 light:new THREE.MeshStandardMaterial({color:0xe9d1a3,emissive:0xbaa27f,emissiveIntensity:1.35,roughness:.8,side:THREE.DoubleSide})
};
const geometries={};
for(const [name,v] of Object.entries(data.models)){
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(v.v,3));
 geo.setIndex(v.f);
 geo.computeVertexNormals();
 geometries[name]=geo;
}
const movers=[];
for(const item of data.parts){
 const m=new THREE.Mesh(geometries[item.g],material[item.color]);
 m.name=item.name;
 m.position.set(...item.p);
 m.userData.initialX=item.p[0];
 scene.add(m);
 if(item.motion!=='fixed')movers.push([m,item.motion]);
}
const scrub=document.getElementById('scrub');
const value=document.getElementById('value');
const button=document.getElementById('toggle');
const query=new URLSearchParams(location.search);
let f=Math.max(0,Math.min(1,Number(query.get('pose')??.5)));
let playing=!query.has('pose');
let epoch=performance.now();
function pose(frac){
 f=frac;
 const theta=data.kinematics.closed_deg+(data.kinematics.open_deg-data.kinematics.closed_deg)*frac;
 const shift=data.kinematics.rack_pitch_radius_mm*(theta-data.kinematics.closed_deg)*Math.PI/180;
 for(const [m,motion] of movers){
  if(motion==='leaf')m.rotation.y=theta*Math.PI/180;
  else if(motion==='gear')m.rotation.y=(theta-data.kinematics.closed_deg)*Math.PI/180;
  else if(motion==='rack')m.position.x=m.userData.initialX+shift;
 }
 scrub.value=Math.round(frac*1000);
 value.textContent=theta.toFixed(1)+String.fromCharCode(176);
}
pose(f);
button.textContent=playing?'PAUSE':'SPEL AV';
button.onclick=()=>{playing=!playing;button.textContent=playing?'PAUSE':'SPEL AV';epoch=performance.now()-Math.acos(1-2*f)*4400/(2*Math.PI)};
scrub.oninput=()=>{playing=false;button.textContent='SPEL AV';pose(Number(scrub.value)/1000)};
let dragging=false,px=0,py=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 yaw-=(e.clientX-px)*.006;
 elevation=Math.max(-1.1,Math.min(1.25,elevation+(e.clientY-py)*.005));
 px=e.clientX;py=e.clientY;updateCamera()
});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(340,Math.min(1550,radius*Math.exp(e.deltaY*.001)));updateCamera()},{passive:false});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){
 if(playing){const t=(performance.now()-epoch)*2*Math.PI/4400;pose((1-Math.cos(t))/2)}
 renderer.render(scene,camera);
 window.SCENE_READY=true;
 requestAnimationFrame(animate);
}
animate();
</script>
