</style></head><body><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE · RUNDE 2</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">OVERSIKT</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 1 av 10</text><text x="12.00" y="28.00" class="tittel" text-anchor="start">Tre skissemodellar til konseptgjennomgangen 18.11</text><text x="12.00" y="35.00" class="ingress" text-anchor="start">Runde 2: alle tre held veggen bak skjermen lys i arbeid. Kvar modell syner lyset i rommet, ikkje forma.</text><text x="12.00" y="46.00" class="mono svart" text-anchor="start">A SKIVA</text><text x="12.00" y="52.00" class="kursiv" text-anchor="start">vipp skiva.</text><text x="12.00" y="60.00" class="mono" text-anchor="start">FRÅ BYGGJESETTET</text><text x="12.00" y="65.50" class="brod" text-anchor="start">· stolpen frå overheadprojektoren</text><text x="12.00" y="69.90" class="brod" text-anchor="start">· reflektorfilm frå LCD-skjermen, om du har</text><text x="12.00" y="74.30" class="brod" text-anchor="start">· ribba (3D-print, STL i mappa)</text><text x="12.00" y="82.20" class="mono" text-anchor="start">LAG ELLER SKAFF</text><text x="12.00" y="87.70" class="brod" text-anchor="start">· skive Ø 250 mm: glatt folie, kvit og matt bakside</text><text x="12.00" y="92.10" class="brod" text-anchor="start">· veggflik 12 × 8,4 cm, folie og bakepapir</text><text x="12.00" y="96.50" class="brod" text-anchor="start">· papplist som held fliken ved sida av stolpen</text><text x="12.00" y="100.90" class="brod" text-anchor="start">· arm 13,5 cm med ledd</text><text x="12.00" y="105.30" class="brod" text-anchor="start">· to svarte papprull: 34 og 71 mm lange</text><text x="12.00" y="109.70" class="brod" text-anchor="start">· to lykter i foten</text><text x="105.67" y="46.00" class="mono svart" text-anchor="start">B OVER</text><text x="105.67" y="52.00" class="kursiv" text-anchor="start">vipp plata.</text><text x="105.67" y="60.00" class="mono" text-anchor="start">FRÅ BYGGJESETTET</text><text x="105.67" y="65.50" class="brod" text-anchor="start">· fresnelplata 285 × 285 mm</text><text x="105.67" y="69.90" class="brod" text-anchor="start">· stolpen frå overheadprojektoren</text><text x="105.67" y="74.30" class="brod" text-anchor="start">· to diffusorark</text><text x="105.67" y="82.20" class="mono" text-anchor="start">LAG ELLER SKAFF</text><text x="105.67" y="87.70" class="brod" text-anchor="start">· pappramme, tappar midt på sidekantane</text><text x="105.67" y="92.10" class="brod" text-anchor="start">· stag med merke for stemning og arbeid</text><text x="105.67" y="96.50" class="brod" text-anchor="start">· flik 60 mm, blank folie på papp</text><text x="105.67" y="100.90" class="brod" text-anchor="start">· brønn: svart krage Ø 25 × 10,5 mm</text><text x="105.67" y="105.30" class="brod" text-anchor="start">· kloss 9 cm på skjermkanten</text><text x="199.33" y="46.00" class="mono svart" text-anchor="start">C VINDAUGE</text><text x="199.33" y="52.00" class="kursiv" text-anchor="start">skyv spegelen inn.</text><text x="199.33" y="60.00" class="mono" text-anchor="start">FRÅ BYGGJESETTET</text><text x="199.33" y="65.50" class="brod" text-anchor="start">· frontflatespegelen frå projektorhovudet</text><text x="199.33" y="69.90" class="brod" text-anchor="start">· stolpen frå overheadprojektoren</text><text x="199.33" y="77.80" class="mono" text-anchor="start">LAG ELLER SKAFF</text><text x="199.33" y="83.30" class="brod" text-anchor="start">· julekule av glas Ø 70 mm, fylt med vatn (kjøp)</text><text x="199.33" y="87.70" class="brod" text-anchor="start">· kredittkort-fresnel 85 × 55 mm (kjøp)</text><text x="199.33" y="92.10" class="brod" text-anchor="start">· maske og gråfilter (side 10)</text><text x="199.33" y="96.50" class="brod" text-anchor="start">· pappflik for spegelen, 65 % av strålen</text><text x="199.33" y="100.90" class="brod" text-anchor="start">· lekt eller kloss: hovudet 70 cm opp</text><line x1="12" y1="122" x2="285" y2="122" class="haar"/><text x="12.00" y="128.00" class="mono" text-anchor="start">REKKJEFØLGJE</text><text x="12.00" y="134.00" class="brod" text-anchor="start">1  Start 3D-printen av ribba til A. Ho printar medan du gjer resten.</text><text x="12.00" y="138.40" class="brod" text-anchor="start">2  Mål lobebreidda (side 2 og 3). A krev under 4,5°. Send tala før du byggjer A.</text><text x="12.00" y="142.80" class="brod" text-anchor="start">3  Byggj éin modell om gongen: det finst berre éin stolpe.</text><text x="12.00" y="147.20" class="brod" text-anchor="start">     Han når 30 til 40 cm. B treng 62 cm og C 70 cm: set han på ein kloss eller ei lekt.</text><text x="12.00" y="151.60" class="brod" text-anchor="start">4  B først, så A når ribba er ferdig, så C.</text><text x="12.00" y="156.00" class="brod" text-anchor="start">5  Fotografer etter fotolista. Kameraet er ein annan telefon enn lykta.</text><text x="12.00" y="160.40" class="brod" text-anchor="start">6  Vipp og skyv med to fingrar eller i leddet, ikkje med eit dytt. Eit dytt veltar</text><text x="12.00" y="164.80" class="brod" text-anchor="start">     alle tre, og det same gjeld produktet: handlinga må vere eit kraftpar.</text><text x="159.42" y="128.00" class="mono" text-anchor="start">TRYGGLEIK</text><text x="159.42" y="134.00" class="brod" text-anchor="start">Projektoren: dra ut støpselet og klipp det av eller merk det før du fjernar leidningane.</text><text x="159.42" y="138.40" class="brod" text-anchor="start">Fresnelplata, blanke hole former og vasskula samlar sollys og kan tenne papp.</text><text x="159.42" y="142.80" class="brod" text-anchor="start">     Aldri i sol eller ved vindauge. Lagre dei tildekte.</text><text x="159.42" y="147.20" class="brod" text-anchor="start">Julekula er tynt glas: fyll ho over ei skål med hanskar, tett opninga,</text><text x="159.42" y="151.60" class="brod" text-anchor="start">     hald vatn borte frå telefonen og lykta.</text><text x="159.42" y="156.00" class="brod" text-anchor="start">Frontflatespegelen: rør ikkje flata, teip berre på baksida og kantane.</text><text x="159.42" y="160.40" class="brod" text-anchor="start">     Kantane kan vere uslipte. Teip dei.</text><text x="159.42" y="164.80" class="brod" text-anchor="start">Skiva i A: vend ho alltid med spegelsida mot skjermen. Går spegelsida</text><text x="159.42" y="169.20" class="brod" text-anchor="start">     forbi andletet ditt, kastar ho lyset frå lykta rett i auga.</text><text x="12.00" y="187.00" class="liten" text-anchor="start">Måla og vinklane er rekna frå lysmodellen i konsept/tre (runde 2). Modellen er ikkje målt: sikt etter lysflekken, ikkje etter gradene.</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE · RUNDE 2</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">LOBEBREIDDA</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 2 av 10</text><text x="12.00" y="28.00" class="tittel" text-anchor="start">Mål lobebreidda først</text><text x="12.00" y="35.00" class="ingress" text-anchor="start">Ho avgjer om skiva i A held blendingskravet F1. A krev ei flate med lobe under 4,5°.</text><text x="12.00" y="46.00" class="mono" text-anchor="start">SETT OVANFRÅ, IKKJE I MÅLESTOKK</text><line x1="66" y1="92" x2="98" y2="92" stroke="#000" stroke-width="1.2"/><text x="82.00" y="98.00" class="mono" text-anchor="middle">prøva, maskert til Ø 10 mm</text><line x1="50.9" y1="60.9" x2="82" y2="92" class="straale"/><line x1="82" y1="92" x2="103.2" y2="70.8" class="straale"/><circle cx="50.9" cy="60.9" r="2" fill="#000"/><text x="46.89" y="61.89" class="mono" text-anchor="end">lykta</text><line x1="96.8" y1="64.4" x2="109.6" y2="77.2" stroke="#000" stroke-width="1.2"/><text x="112.21" y="67.79" class="mono" text-anchor="start">målekortet (side 3)</text><line x1="82" y1="92" x2="82" y2="58" class="hjelp"/><text x="74.00" y="80.00" class="mono" text-anchor="middle">45°</text><text x="90.00" y="80.00" class="mono" text-anchor="middle">45°</text><text x="62.44" y="79.44" class="mono" text-anchor="end">1 m</text><text x="97.61" y="85.39" class="mono" text-anchor="start">d = 50 cm</text><text x="162.00" y="46.00" class="mono" text-anchor="start">SLIK GJER DU</text><text x="162.00" y="52.00" class="brod" text-anchor="start">1  Mørkt rom. Lykta 1 m frå prøva, lyset inn på 45°.</text><text x="162.00" y="56.40" class="brod" text-anchor="start">2  Dekk prøva med svart papp med eit hol på Ø 10 mm.</text><text x="162.00" y="60.80" class="brod" text-anchor="start">     Utan maske måler du storleiken på prøva, ikkje loben.</text><text x="162.00" y="65.20" class="brod" text-anchor="start">3  Målekortet 50 cm frå prøva, vinkelrett på den speglande strålen.</text><text x="162.00" y="69.60" class="brod" text-anchor="start">4  Les av diameteren D der flekken er halvparten så lys som midten.</text><text x="162.00" y="74.00" class="brod" text-anchor="start">     Foto med låst eksponering, teke med ein annan telefon enn lykta.</text><text x="162.00" y="78.40" class="brod" text-anchor="start">5  Trekk frå holet: D_lobe ≈ √(D² − 1,5²), D i cm.</text><text x="162.00" y="82.80" class="brod" text-anchor="start">6  σ ≈ 0,48 · D_lobe i grader (σ ≈ 24 · D_lobe / d).</text><text x="162.00" y="87.20" class="brod" text-anchor="start">7  Send tabellen og bileta, så blir tala lagde inn i modellen.</text><text x="162.00" y="96.00" class="liten" text-anchor="start">A krev σ under 4,5°: D_lobe under 9 cm. Blank folie 2,5° gjev D_lobe ≈ 5 cm.</text><text x="162.00" y="101.00" class="liten" text-anchor="start">Frå 25 cm ser auget om lag 700 cd/m² ved 4° og 4100 cd/m² ved 6°. Grensa for F1 ligg om lag ved 5°.</text><text x="12.00" y="112.00" class="mono" text-anchor="start">PRØVE</text><text x="96.00" y="112.00" class="mono" text-anchor="start">D, CM</text><text x="120.00" y="112.00" class="mono" text-anchor="start">D_LOBE</text><text x="144.00" y="112.00" class="mono" text-anchor="start">σ, GRADER</text><text x="172.00" y="112.00" class="mono" text-anchor="start">FOTO NR.</text><text x="197.00" y="112.00" class="mono" text-anchor="start">MERKNAD</text><line x1="12" y1="122.2" x2="285" y2="122.2" class="haar"/><text x="12.00" y="120.00" class="brod" text-anchor="start">1  folie på papp, blank side</text><line x1="12" y1="129.4" x2="285" y2="129.4" class="haar"/><text x="12.00" y="127.20" class="brod" text-anchor="start">2  folie på papp, matt side</text><line x1="12" y1="136.6" x2="285" y2="136.6" class="haar"/><text x="12.00" y="134.40" class="brod" text-anchor="start">3  reflektorfilm frå LCD-skjermen</text><line x1="12" y1="143.8" x2="285" y2="143.8" class="haar"/><text x="12.00" y="141.60" class="brod" text-anchor="start">4  frontflatespegelen</text><line x1="12" y1="151.0" x2="285" y2="151.0" class="haar"/><text x="12.00" y="148.80" class="brod" text-anchor="start">5  fresnelplata utan ark</text><line x1="12" y1="158.2" x2="285" y2="158.2" class="haar"/><text x="12.00" y="156.00" class="brod" text-anchor="start">6  fresnelplata, eitt diffusorark</text><line x1="12" y1="165.4" x2="285" y2="165.4" class="haar"/><text x="12.00" y="163.20" class="brod" text-anchor="start">7  fresnelplata, to diffusorark</text><line x1="12" y1="172.6" x2="285" y2="172.6" class="haar"/><text x="12.00" y="170.40" class="brod" text-anchor="start">8  bakepapir oppå folie</text><line x1="12" y1="179.8" x2="285" y2="179.8" class="haar"/><text x="12.00" y="177.60" class="brod" text-anchor="start">9  kvitt papir (referanse)</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE · RUNDE 2</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">MÅLEKORTET</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 3 av 10</text><text x="12.00" y="26.00" class="tittel" text-anchor="start">Målekortet</text><text x="12.00" y="34.00" class="liten" text-anchor="start">Les av diameteren der flekken</text><text x="12.00" y="38.00" class="liten" text-anchor="start">er halvparten så lys som midten.</text><text x="12.00" y="42.00" class="liten" text-anchor="start">Linjene er tynne med vilje.</text><circle cx="148.5" cy="107.0" r="10.0" fill="none" stroke="#9a9a9a" stroke-width="0.15"/><text x="156.57" y="98.93" class="mono grå" text-anchor="start">2 cm</text><circle cx="148.5" cy="107.0" r="20.0" fill="none" stroke="#9a9a9a" stroke-width="0.15"/><text x="163.64" y="91.86" class="mono grå" text-anchor="start">4 cm</text><circle cx="148.5" cy="107.0" r="30.0" fill="none" stroke="#9a9a9a" stroke-width="0.15"/><text x="170.71" y="84.79" class="mono grå" text-anchor="start">6 cm</text><circle cx="148.5" cy="107.0" r="40.0" fill="none" stroke="#9a9a9a" stroke-width="0.15"/><text x="177.78" y="77.72" class="mono grå" text-anchor="start">8 cm</text><circle cx="148.5" cy="107.0" r="50.0" fill="none" stroke="#9a9a9a" stroke-width="0.15"/><text x="184.85" y="70.65" class="mono grå" text-anchor="start">10 cm</text><circle cx="148.5" cy="107.0" r="60.0" fill="none" stroke="#9a9a9a" stroke-width="0.15"/><text x="191.92" y="63.58" class="mono grå" text-anchor="start">12 cm</text><circle cx="148.5" cy="107.0" r="70.0" fill="none" stroke="#9a9a9a" stroke-width="0.15"/><text x="198.99" y="56.51" class="mono grå" text-anchor="start">14 cm</text><circle cx="148.5" cy="107.0" r="80.0" fill="none" stroke="#9a9a9a" stroke-width="0.15"/><text x="206.06" y="49.44" class="mono grå" text-anchor="start">16 cm</text><circle cx="148.5" cy="107.0" r="45.62" fill="none" stroke="#000" stroke-width="0.2" stroke-dasharray="1.5 1.5"/><text x="115.25" y="143.25" class="mono svart" text-anchor="end">grensa for A</text><line x1="142.5" y1="107.0" x2="154.5" y2="107.0" stroke="#000" stroke-width="0.25"/><line x1="148.5" y1="101.0" x2="148.5" y2="113.0" stroke="#000" stroke-width="0.25"/><text x="12.00" y="172.00" class="liten" text-anchor="start">Ringane viser D i cm, før holet</text><text x="12.00" y="176.00" class="liten" text-anchor="start">er trekt frå. Stipla ring: D_lobe</text><text x="12.00" y="180.00" class="liten" text-anchor="start">9 cm, grensa for A (σ 4,5°).</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE · RUNDE 2</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">A SKIVA</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 4 av 10</text><text x="12.00" y="28.00" class="tittel" text-anchor="start">A Skiva: plassering og bygging</text><text x="12.00" y="35.00" class="ingress" text-anchor="start">Ei lykt i foten lyser på ei bøygd spegelskive som vippar frå veggen ned på feltet. Ein fast flik ved stolpen held veggen bak skjermen lys.</text><text x="12.00" y="46.00" class="mono" text-anchor="start">MÅL FRÅ MODELLEN</text><text x="12.00" y="52.00" class="brod" text-anchor="start">Foten: 47 cm til høgre for skjermmidten, 7 cm framfor skjermplanet.</text><text x="12.00" y="56.40" class="brod" text-anchor="start">Stolpen: 1,5 cm framfor skjermplanet. Armen held skiva 13,5 cm framfor stolpen.</text><text x="12.00" y="60.80" class="brod" text-anchor="start">Skiva: midten 41 cm over bordet, 15 cm framfor skjermplanet, altså 8 cm</text><text x="12.00" y="65.20" class="brod" text-anchor="start">     framfor lykta. Spegelsida er kuv: ho bular ut mot lykta, 6,5 mm på 250 mm.</text><text x="12.00" y="69.60" class="brod" text-anchor="start">Hovudlykta: 5 cm over bordet, vippa om lag 12° fram mot skivemidten (37 cm unna).</text><text x="12.00" y="74.00" class="brod" text-anchor="start">Fliken: 12 × 8,4 cm, midten 30 cm over bordet, 3,5 cm til venstre for stolpen</text><text x="12.00" y="78.40" class="brod" text-anchor="start">     og 2,5 cm framfor skjermplanet. Fest han på ein papplist: rett på stolpen</text><text x="12.00" y="82.80" class="brod" text-anchor="start">     kastar stolpen skugge på veggen. Fliken vender ned og mot venstre, om lag 52°</text><text x="12.00" y="87.20" class="brod" text-anchor="start">     mot vassrett, og siktar på veggen bak skjermmidten, 45 cm over bordet.</text><text x="12.00" y="91.60" class="brod" text-anchor="start">Fliklykta: 3,5 cm til venstre for og 2 cm bak hovudlykta, peikar nesten rett opp</text><text x="12.00" y="96.00" class="brod" text-anchor="start">     på fliken (25 cm unna). Om lag 30 % av lyset.</text><text x="12.00" y="100.40" class="brod" text-anchor="start">Stemning: sikt skiveflekken midt på veggen bak skjermen. Arbeid: 10 cm til</text><text x="12.00" y="104.80" class="brod" text-anchor="start">     venstre for feltmidten. Fliken står fast i begge.</text><text x="12.00" y="109.20" class="brod" text-anchor="start">Møte (F10): sløkk fliklykta. Vend skiva så den kvite baksida ser ned mot lykta</text><text x="12.00" y="113.60" class="brod" text-anchor="start">     og mot ansiktet. Vend den korte vegen (150°): spegelsida peikar mot skjermen</text><text x="12.00" y="118.00" class="brod" text-anchor="start">     og veggen heile tida, aldri mot deg. Den lange vegen kastar lyset i auga.</text><text x="12.00" y="122.40" class="brod" text-anchor="start">     Lykta må spreie meir enn i arbeid (18° mot 10°): røyr på 17 mm, halve hovudrøyret.</text><text x="181.26" y="46.00" class="mono" text-anchor="start">BYGGING</text><text x="181.26" y="52.00" class="brod" text-anchor="start">1  Skjer skiva i papp (side 5 og 6, eller A3).</text><text x="181.26" y="56.40" class="brod" text-anchor="start">2  Lim glatt folie på, blank side ut, utan krøll.</text><text x="181.26" y="60.80" class="brod" text-anchor="start">     Reflektorfilm frå LCD-skjermen er betre.</text><text x="181.26" y="65.20" class="brod" text-anchor="start">     Kvitt, matt papir på baksida (møte).</text><text x="181.26" y="69.60" class="brod" text-anchor="start">3  Teip ribba bak, på tvers av kastet.</text><text x="181.26" y="74.00" class="brod" text-anchor="start">4  Skjer armen og fliken (side 7). Fliken: folie</text><text x="181.26" y="78.40" class="brod" text-anchor="start">     med bakepapir oppå, matt flik blendar.</text><text x="181.26" y="82.80" class="brod" text-anchor="start">5  Rull røyra og set dei på lyktene: 34 mm på</text><text x="181.26" y="87.20" class="brod" text-anchor="start">     hovudlykta og 71 mm på fliklykta. Er ho ei</text><text x="181.26" y="91.60" class="brod" text-anchor="start">     lita lommelykt: Ø 15 × 43 mm.</text><text x="181.26" y="96.00" class="brod" text-anchor="start">6  Fest armen på stolpen med ledd, så skiva</text><text x="181.26" y="100.40" class="brod" text-anchor="start">     kan vippe og bli ståande.</text><text x="181.26" y="104.80" class="brod" text-anchor="start">7  Teip fliken på ein papplist, 3,5 cm til</text><text x="181.26" y="109.20" class="brod" text-anchor="start">     venstre for stolpen.</text><text x="181.26" y="113.60" class="brod" text-anchor="start">8  Føreseiing: lågaste rute over 0,5 av snittet</text><text x="181.26" y="118.00" class="brod" text-anchor="start">     med bogen, under 0,45 flat. Veggen bak</text><text x="181.26" y="122.40" class="brod" text-anchor="start">     skjermen om lag ein tredel av feltet i arbeid.</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE · RUNDE 2</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">A SKIVA, MAL 1</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1 NORTHERN · BYGGJEPAKKE · RUNDE 2</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">B OVER</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 8 av 10</text><text x="12.00" y="28.00" class="tittel" text-anchor="start">B Over: plassering, bygging og mal</text><text x="12.00" y="35.00" class="ingress" text-anchor="start">Fresnelplata over skjermkanten er knekt. Den store delen vippar lyset frå veggen ned på bordet, fliken held veggen bak skjermen lys.</text><text x="12.00" y="46.00" class="mono" text-anchor="start">MÅL FRÅ MODELLEN</text><text x="12.00" y="52.00" class="brod" text-anchor="start">Plata: midten 62 cm over bordet, 20 cm over skjermkanten, midt framfor brukaren og</text><text x="12.00" y="56.40" class="brod" text-anchor="start">     9 cm framfor skjermplanet. Ho vippar om ein vassrett akse gjennom midten.</text><text x="12.00" y="60.80" class="brod" text-anchor="start">     Tappar midt på sidekantane, ikkje hengsel langs bakkanten.</text><text x="12.00" y="65.20" class="brod" text-anchor="start">Lykta: 12 cm under plata, 51 cm over bordet og 4 cm framfor skjermplanet:</text><text x="12.00" y="69.60" class="brod" text-anchor="start">     ein kloss 9 cm over skjermkanten. Ho peikar opp mot midten av plata.</text><text x="12.00" y="74.00" class="brod" text-anchor="start">Knekken går langs midtlina frå venstre til høgre. Den framre halvdelen er hovuddelen.</text><text x="12.00" y="78.40" class="brod" text-anchor="start">     Fliken er dei 60 mm bak midtlina, knekt 48° mot hovuddelen. Dei bakste 82,5 mm er dekte.</text><text x="12.00" y="82.80" class="brod" text-anchor="start">Arbeid: hovuddelen nesten vassrett (om lag 7°) og siktar på feltmidten,</text><text x="12.00" y="87.20" class="brod" text-anchor="start">     fliken om lag 55° og siktar på veggen 60 cm over bordet.</text><text x="12.00" y="91.60" class="brod" text-anchor="start">Stemning: heile plata vippar 48°, så begge delar siktar på veggen.</text><text x="12.00" y="96.00" class="brod" text-anchor="start">Brønnen skjermar ved 50°. Med 64° ser auget dioden frå 60 cm.</text><text x="181.26" y="46.00" class="mono" text-anchor="start">BYGGING</text><text x="181.26" y="52.00" class="brod" text-anchor="start">1  Ikkje skjer i fresnelplata. Plata er éi.</text><text x="181.26" y="56.40" class="brod" text-anchor="start">     Dekk dei bakste 142,5 mm med svart papp,</text><text x="181.26" y="60.80" class="brod" text-anchor="start">     og teip ein flik av blank folie på papp</text><text x="181.26" y="65.20" class="brod" text-anchor="start">     (60 × 285 mm) langs midtlina, 48° opp.</text><text x="181.26" y="69.60" class="brod" text-anchor="start">     Folieflika gjev veggen like mykje lys som</text><text x="181.26" y="74.00" class="brod" text-anchor="start">     ein fresnelstrimmel (135 mot 134 lx i modellen).</text><text x="181.26" y="78.40" class="brod" text-anchor="start">2  Same side opp som i projektoren, mot lykta.</text><text x="181.26" y="82.80" class="brod" text-anchor="start">3  Ramme med tappar midt på sidekantane,</text><text x="181.26" y="87.20" class="brod" text-anchor="start">     og eit stag med merke for dei to stillingane.</text><text x="181.26" y="91.60" class="brod" text-anchor="start">4  To diffusorark på hovuddelen.</text><text x="181.26" y="96.00" class="brod" text-anchor="start">5  Føreseiing: jamnheit om lag 0,4, veggen</text><text x="181.26" y="100.40" class="brod" text-anchor="start">     bak skjermen om lag ein tredel av feltet.</text><rect x="30.00" y="118.00" width="86.54" height="10.49" class="kutt"/><line x1="108.54" y1="118.00" x2="108.54" y2="128.49" class="fald"/><line x1="30.00" y1="132.49" x2="116.54" y2="132.49" class="maal"/><line x1="30.00" y1="130.89" x2="30.00" y2="134.09" class="maal"/><line x1="116.54" y1="130.89" x2="116.54" y2="134.09" class="maal"/><text transform="translate(73.27,136.69) rotate(0.0)" class="mono" text-anchor="middle">86,5 mm</text><line x1="26.00" y1="118.00" x2="26.00" y2="128.49" class="maal"/><line x1="27.60" y1="118.00" x2="24.40" y2="118.00" class="maal"/><line x1="27.60" y1="128.49" x2="24.40" y2="128.49" class="maal"/><text x="27.20" y="124.24" class="mono" text-anchor="end"></text><text x="23.50" y="124.24" class="mono" text-anchor="end">10,5 mm</text><text x="30.00" y="110.50" class="mono" text-anchor="start">BRØNN · krage Ø 25 mm, 10,5 mm høg, svart papp</text><text x="30.00" y="114.30" class="mono" text-anchor="start">gjev avskjerming ved 50° frå aksen</text><text x="142.00" y="114.00" class="mono" text-anchor="start">PLATA SETT OVANFRÅ (1:5)</text><rect x="142.00" y="118.00" width="57.00" height="57.00" class="tynn"/><line x1="142.00" y1="146.50" x2="199.00" y2="146.50" class="fald"/><rect x="142.00" y="118.00" width="57.00" height="16.50" fill="#d0d0d0" stroke="none"/><rect x="142.00" y="134.50" width="57.00" height="12.00" fill="none" stroke="#000" stroke-width="0.35"/><text x="203.00" y="127.20" class="mono grå" text-anchor="start">dekt, 82,5 mm</text><text x="203.00" y="141.50" class="mono grå" text-anchor="start">flik, 60 mm, 48° opp</text><text x="203.00" y="161.60" class="mono grå" text-anchor="start">hovuddel, 142,5 mm</text><text x="170.50" y="179.50" class="mono grå" text-anchor="middle">mot brukaren</text><text x="170.50" y="116.50" class="mono grå" text-anchor="middle"></text><text x="203.00" y="117.00" class="mono grå" text-anchor="start">mot veggen</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE · RUNDE 2</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">C VINDAUGE</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 9 av 10</text><text x="12.00" y="28.00" class="tittel" text-anchor="start">C Vindauge: plassering og bygging</text><text x="12.00" y="35.00" class="ingress" text-anchor="start">Ei vasskule teiknar eit vindauge av lys på veggen. Ein spegel glir inn i strålen og legg feltet på bordet, medan vindauget blir.</text><text x="12.00" y="46.00" class="mono" text-anchor="start">MÅL FRÅ MODELLEN</text><text x="12.00" y="52.00" class="brod" text-anchor="start">Hovudet: 70 cm over bordet, 40 cm til høgre for skjermmidten, 3 cm framfor</text><text x="12.00" y="56.40" class="brod" text-anchor="start">     skjermplanet. Foten 5 cm bak skjermplanet. Stolpen på ein kloss eller ei lekt.</text><text x="12.00" y="60.80" class="brod" text-anchor="start">Utan spegel: sikt midt på veggen bak skjermen, 42 cm over bordet (56 cm unna).</text><text x="12.00" y="65.20" class="brod" text-anchor="start">Spegelen inne: 65 % av strålen går ned på feltmidten (82 cm unna).</text><text x="12.00" y="69.60" class="brod" text-anchor="start">     Strålen bøyer om lag 48° mellom vegg og felt. Resten blir verande vindauge.</text><text x="12.00" y="74.00" class="brod" text-anchor="start">Linsa: julekule av glas, Ø 70 mm, fylt med vatn. f om lag 70 mm frå midten av kula.</text><text x="12.00" y="78.40" class="brod" text-anchor="start">Maska: 62 mm frå midten av kula, innanfor fokus (76 mm),</text><text x="12.00" y="82.80" class="brod" text-anchor="start">     så kanten blir mjuk, om lag 6 cm på bordet.</text><text x="12.00" y="87.20" class="brod" text-anchor="start">Kondensoren: kredittkort-fresnel 85 × 55 mm rett bak maska, mot lykta.</text><text x="12.00" y="91.60" class="brod" text-anchor="start">Gråfilteret ligg i maska og dempar den delen av feltet som er nærast lampa.</text><text x="181.26" y="46.00" class="mono" text-anchor="start">BYGGING</text><text x="181.26" y="52.00" class="brod" text-anchor="start">1  Fyll kula over ei skål, med hanskar. Tett</text><text x="181.26" y="56.40" class="brod" text-anchor="start">     opninga. Kula kviler i ein ring av papp.</text><text x="181.26" y="60.80" class="brod" text-anchor="start">2  Skriv ut maska og gråfilteret (side 10):</text><text x="181.26" y="65.20" class="brod" text-anchor="start">     maska på papir, filteret på overheadfilm.</text><text x="181.26" y="69.60" class="brod" text-anchor="start">3  Lykt, kondensor, filter og maske i éin</text><text x="181.26" y="74.00" class="brod" text-anchor="start">     svart pappboks. Maska vender mot kula.</text><text x="181.26" y="78.40" class="brod" text-anchor="start">4  Frontflatespegelen på ei pappflik rett etter</text><text x="181.26" y="82.80" class="brod" text-anchor="start">     kula. Inne dekkjer flika 65 % av strålen.</text><text x="181.26" y="87.20" class="brod" text-anchor="start">5  Drei og snu maska til hjørna treffer feltet.</text><text x="181.26" y="91.60" class="brod" text-anchor="start">6  Føreseiing: vindauget står i ro medan feltet</text><text x="181.26" y="96.00" class="brod" text-anchor="start">     kjem fram, og skjermen får under 0,15 av</text><text x="181.26" y="100.40" class="brod" text-anchor="start">     feltet heile vegen.</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><rect x="0" y="0" width="297" height="210" fill="# text x="12.00" y="160.00" class="liten" text-anchor="start">Hjørna lagar desse hjørna i feltet:</text><text x="12.00" y="164.00" class="liten" text-anchor="start">· framkant venstre: x 4,1 mm, y 18,5 mm frå krossen</text><text x="12.00" y="168.00" class="liten" text-anchor="start">· framkant høgre: x 26,0 mm, y -14,5 mm frå krossen</text><text x="12.00" y="172.00" class="liten" text-anchor="start">· bakkant høgre: x -6,5 mm, y -29,3 mm frå krossen</text><text x="12.00" y="176.00" class="liten" text-anchor="start">· bakkant venstre: x -20,2 mm, y 11,2 mm frå krossen</text><text x="152.00" y="160.00" class="liten" text-anchor="start">Maska og filteret ligg oppå kvarandre, krossen på krossen.</text><text x="152.00" y="164.00" class="liten" text-anchor="start">Filteret slepp gjennom 47 til 100 %: mørkast der feltet er nærast lampa.</text><text x="152.00" y="168.00" class="liten" text-anchor="start">Linsa snur biletet. Ligg feltet feil, snu maska og filteret saman.</text><text x="152.00" y="172.00" class="liten" text-anchor="start">Maska 62 mm frå midten av kula. Kondensoren rett bak maska.</text></svg></section></body></html>
