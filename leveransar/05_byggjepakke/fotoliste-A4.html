</style></head><body><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE · RUNDE 2</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">FOTOLISTE</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 1 av 2</text><text x="12.00" y="30.00" class="tittel" text-anchor="start">Fotoliste: same rom, same kamera, tre modellar</text><text x="12.00" y="38.00" class="ingress" text-anchor="start">Bileta skal kunne samanliknast med rendringane på side 10 til 13. Difor står kameraet der rendrekameraet står.</text><text x="12.00" y="50.00" class="mono" text-anchor="start">KAMERAPLASSEN</text><text x="12.00" y="56.00" class="brod" text-anchor="start">98 cm til høgre for skjermmidten, 1,40 m framfor bordkanten,</text><text x="12.00" y="60.60" class="brod" text-anchor="start">80 cm over bordplata. Sikt på skjermfoten.</text><text x="12.00" y="65.20" class="brod" text-anchor="start">Telefonen på stativ eller ein bokstabel, så han står heilt i ro.</text><text x="12.00" y="69.80" class="brod" text-anchor="start">Bruk 2× zoom: det gjev om lag same biletvinkel som rendringane (43°).</text><text x="12.00" y="74.40" class="brod" text-anchor="start">Kvadratisk format (1:1), eller beskjer kvadratisk etterpå.</text><text x="12.00" y="79.00" class="brod" text-anchor="start">Merk kameraplassen med teip på golvet, så du finn han att.</text><text x="12.00" y="90.00" class="mono" text-anchor="start">LYS OG INNSTILLINGAR</text><text x="12.00" y="96.00" class="brod" text-anchor="start">Mørkt rom. Skjermen på, mørkt tema, låg lysstyrke.</text><text x="12.00" y="100.60" class="brod" text-anchor="start">Lås eksponering og fokus: hald fingeren på skjermen til AE/AF-lås.</text><text x="12.00" y="105.20" class="brod" text-anchor="start">Ingen blits. Same innstilling for alle tre modellane.</text><text x="12.00" y="109.80" class="brod" text-anchor="start">Ta først eitt bilete utan lampe, berre skjermen. Det er referansen.</text><text x="12.00" y="114.40" class="brod" text-anchor="start">Sit på plassen sjølv, eller la stolen stå med eit mørkt plagg over.</text><text x="153.96" y="50.00" class="mono" text-anchor="start">BILETA PER MODELL</text><text x="153.96" y="56.00" class="mono grå" text-anchor="start">NR</text><text x="160.96" y="56.00" class="mono grå" text-anchor="start">FILNAMN</text><text x="191.96" y="56.00" class="mono grå" text-anchor="start">KVA</text><text x="251.96" y="56.00" class="mono grå" text-anchor="start">TIL</text><text x="153.96" y="62.00" class="brod" text-anchor="start">1</text><text x="160.96" y="62.00" class="brod svart" text-anchor="start">stemning</text><text x="191.96" y="62.00" class="brod" text-anchor="start">kameraplassen, lampa i stemning</text><text x="251.96" y="62.00" class="brod" text-anchor="start">side 11 til 13, venstre</text><text x="153.96" y="68.00" class="brod" text-anchor="start">2</text><text x="160.96" y="68.00" class="brod svart" text-anchor="start">arbeid</text><text x="191.96" y="68.00" class="brod" text-anchor="start">kameraplassen, lampa i arbeid</text><text x="251.96" y="68.00" class="brod" text-anchor="start">side 11 til 13, høgre</text><text x="153.96" y="74.00" class="brod" text-anchor="start">3</text><text x="160.96" y="74.00" class="brod svart" text-anchor="start">overgang</text><text x="191.96" y="74.00" class="brod" text-anchor="start">kameraplassen, gesten halvvegs</text><text x="251.96" y="74.00" class="brod" text-anchor="start">presentasjonen</text><text x="153.96" y="80.00" class="brod" text-anchor="start">4</text><text x="160.96" y="80.00" class="brod svart" text-anchor="start">gest</text><text x="191.96" y="80.00" class="brod" text-anchor="start">handa i rørsla, nært, romlys på</text><text x="251.96" y="80.00" class="brod" text-anchor="start">presentasjonen</text><text x="153.96" y="86.00" class="brod" text-anchor="start">5</text><text x="160.96" y="86.00" class="brod svart" text-anchor="start">kropp</text><text x="191.96" y="86.00" class="brod" text-anchor="start">modellen frå sida i romlys, rolig bakgrunn</text><text x="251.96" y="86.00" class="brod" text-anchor="start">side 10 og presentasjonen</text><text x="153.96" y="92.00" class="brod" text-anchor="start">6</text><text x="160.96" y="92.00" class="brod svart" text-anchor="start">felt</text><text x="191.96" y="92.00" class="brod" text-anchor="start">arbeid, A4-arket i feltet rett ovanfrå</text><text x="251.96" y="92.00" class="brod" text-anchor="start">jamnheita (F3)</text><text x="153.96" y="98.00" class="brod" text-anchor="start">7</text><text x="160.96" y="98.00" class="brod svart" text-anchor="start">auge-25, -47, -60</text><text x="191.96" y="98.00" class="brod" text-anchor="start">frå augehøgda 25, 47 og 60 cm over bordet</text><text x="251.96" y="98.00" class="brod" text-anchor="start">blendinga (F1)</text><text x="153.96" y="104.00" class="brod" text-anchor="start">8</text><text x="160.96" y="104.00" class="brod svart" text-anchor="start">mote (berre A)</text><text x="191.96" y="104.00" class="brod" text-anchor="start">skiva vend, fliklykta sløkt, auge 47 cm</text><text x="251.96" y="104.00" class="brod" text-anchor="start">møtelyset (F10)</text><text x="153.96" y="110.00" class="liten" text-anchor="start">Filnamna får bokstaven til modellen først: A-stemning.jpg, B-arbeid.jpg,</text><text x="153.96" y="114.20" class="liten" text-anchor="start">C-kropp.jpg og så vidare. Legg dei i leveransar/03_konsept/foto/.</text><text x="153.96" y="118.40" class="liten" text-anchor="start">Bilete 1, 2 og 5 blir sette inn på sidene når konseptsidene blir laga på nytt.</text><text x="153.96" y="122.60" class="liten" text-anchor="start">Bilete 3, 4, 7 og 8 er til presentasjonen 18.11. Bilete 6 er til målinga.</text><text x="12.00" y="186.00" class="liten" text-anchor="start">Kameraplassen er rendrekameraet i lysmodellen (KAM i konsept/lysskisse/lysskisse.py). Biletvinkelen med 2× zoom er eit overslag.</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE · RUNDE 2</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">MÅLETABELL</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 2 av 2</text><text x="12.00" y="30.00" class="tittel" text-anchor="start">Måletabell for skissemodellane</text><text x="12.00" y="38.00" class="ingress" text-anchor="start">Lux med ein luxmålar eller ein lux-app på telefonen, sensoren rett opp, same app for alle tre. Skriv føreseiinga før du måler.</text><text x="12.00" y="50.00" class="mono" text-anchor="start">FEM PUNKT I FELTET 60 × 40 CM, ARBEID</text><rect x="16" y="56" width="60" height="40" class="tynn"/><circle cx="22.0" cy="60.0" r="1.6" fill="#000"/><text x="24.50" y="61.00" class="mono svart" text-anchor="start">1</text><circle cx="70.0" cy="60.0" r="1.6" fill="#000"/><text x="72.50" y="61.00" class="mono svart" text-anchor="start">2</text><circle cx="46.0" cy="76.0" r="1.6" fill="#000"/><text x="48.50" y="77.00" class="mono svart" text-anchor="start">3</text><circle cx="22.0" cy="92.0" r="1.6" fill="#000"/><text x="24.50" y="93.00" class="mono svart" text-anchor="start">4</text><circle cx="70.0" cy="92.0" r="1.6" fill="#000"/><text x="72.50" y="93.00" class="mono svart" text-anchor="start">5</text><text x="46.00" y="54.00" class="mono grå" text-anchor="middle">skjermen</text><text x="46.00" y="101.00" class="mono grå" text-anchor="middle">brukaren</text><text x="84.00" y="60.00" class="liten" text-anchor="start">Punkta ligg 3 cm inn frå hjørna.</text><text x="84.00" y="64.00" class="liten" text-anchor="start">Jamnheit = lågaste delt på snittet</text><text x="84.00" y="68.00" class="liten" text-anchor="start">av dei fem. Referansen er 0,6.</text><text x="12.00" y="112.00" class="mono" text-anchor="start">MODELL</text><text x="38.00" y="112.00" class="mono" text-anchor="start">FØRESEIING</text><text x="74.00" y="112.00" class="mono" text-anchor="start">1</text><text x="92.00" y="112.00" class="mono" text-anchor="start">2</text><text x="110.00" y="112.00" class="mono" text-anchor="start">3</text><text x="128.00" y="112.00" class="mono" text-anchor="start">4</text><text x="146.00" y="112.00" class="mono" text-anchor="start">5</text><text x="164.00" y="112.00" class="mono" text-anchor="start">SNITT</text><text x="188.00" y="112.00" class="mono" text-anchor="start">JAMNHEIT</text><text x="214.00" y="112.00" class="mono" text-anchor="start">MOT AUGET 25 / 47 / 60 CM, SER DU LYSKJELDA?</text><line x1="12" y1="124" x2="285" y2="124" class="haar"/><text x="12.00" y="121.60" class="brod svart" text-anchor="start">A Skiva</text><text x="38.00" y="121.60" class="brod" text-anchor="start">U over 0,5</text><line x1="12" y1="132" x2="285" y2="132" class="haar"/><text x="12.00" y="129.60" class="brod" text-anchor="start">   stemning</text><line x1="12" y1="140" x2="285" y2="140" class="haar"/><text x="12.00" y="137.60" class="brod svart" text-anchor="start">B Over</text><text x="38.00" y="137.60" class="brod" text-anchor="start">U 0,35 til 0,55</text><line x1="12" y1="148" x2="285" y2="148" class="haar"/><text x="12.00" y="145.60" class="brod" text-anchor="start">   stemning</text><line x1="12" y1="156" x2="285" y2="156" class="haar"/><text x="12.00" y="153.60" class="brod svart" text-anchor="start">C Vindauge</text><text x="38.00" y="153.60" class="brod" text-anchor="start">skjerm < 0,15</text><line x1="12" y1="164" x2="285" y2="164" class="haar"/><text x="12.00" y="161.60" class="brod" text-anchor="start">   stemning</text><text x="12.00" y="174.00" class="liten" text-anchor="start">Føreseiingane er frå byggjepakken: A med bogen over 0,5, flat under 0,45. B 0,46 (0,35 til 0,55) med diffusorark, under 0,05 utan.</text><text x="12.00" y="178.20" class="liten" text-anchor="start">C: vindauget står i ro medan feltet kjem fram, og skjermen får under 0,15 av feltet heile vegen. Lux-appar er unøyaktige i absolutt nivå;</text><text x="12.00" y="182.40" class="liten" text-anchor="start">bruk tala til å samanlikne modellane med kvarandre, ikkje med kravet på 350 lx.</text></svg></section></body></html>
