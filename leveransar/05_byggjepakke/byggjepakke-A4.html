t, ikkje forma. Same telefonlykt i alle tre, så bileta kan samanliknast.</text><text x="12.00" y="52.00" class="mono svart" text-anchor="start">A SKIVA</text><text x="12.00" y="58.00" class="kursiv" text-anchor="start">vipp skiva.</text><text x="12.00" y="67.00" class="mono" text-anchor="start">FRÅ BYGGJESETTET</text><text x="12.00" y="72.50" class="brod" text-anchor="start">· stolpen frå overheadprojektoren</text><text x="12.00" y="77.10" class="brod" text-anchor="start">· telefonen (lykta)</text><text x="12.00" y="81.70" class="brod" text-anchor="start">· reflektorfilm frå LCD-skjermen, om du har</text><text x="12.00" y="86.30" class="brod" text-anchor="start">· ribba (3D-print, STL i mappa)</text><text x="12.00" y="95.40" class="mono" text-anchor="start">LAG SJØLV</text><text x="12.00" y="100.90" class="brod" text-anchor="start">· skive Ø 250 mm av papp med glatt aluminiumsfolie</text><text x="12.00" y="105.50" class="brod" text-anchor="start">· arm 13,5 cm frå stolpen til skivemidten</text><text x="12.00" y="110.10" class="brod" text-anchor="start">· svart papprull Ø 25 × 100 mm</text><text x="12.00" y="114.70" class="brod" text-anchor="start">· kloss så lykta kjem 5 cm over bordet</text><text x="105.67" y="52.00" class="mono svart" text-anchor="start">B OVER</text><text x="105.67" y="58.00" class="kursiv" text-anchor="start">vipp plata.</text><text x="105.67" y="67.00" class="mono" text-anchor="start">FRÅ BYGGJESETTET</text><text x="105.67" y="72.50" class="brod" text-anchor="start">· fresnelplata 285 × 285 mm</text><text x="105.67" y="77.10" class="brod" text-anchor="start">· stolpen frå overheadprojektoren</text><text x="105.67" y="81.70" class="brod" text-anchor="start">· eitt og to diffusorark</text><text x="105.67" y="86.30" class="brod" text-anchor="start">· telefonen (lykta)</text><text x="105.67" y="95.40" class="mono" text-anchor="start">LAG SJØLV</text><text x="105.67" y="100.90" class="brod" text-anchor="start">· pappramme, fire strimlar 20 mm breie</text><text x="105.67" y="105.50" class="brod" text-anchor="start">· teiphengsel langs bakkanten</text><text x="105.67" y="110.10" class="brod" text-anchor="start">· brønn: svart krage Ø 25 × 10,5 mm</text><text x="105.67" y="114.70" class="brod" text-anchor="start">· kloss på skjermkanten, 8 til 9 cm</text><text x="199.33" y="52.00" class="mono svart" text-anchor="start">C VINDAUGE</text><text x="199.33" y="58.00" class="kursiv" text-anchor="start">skyv spegelen inn.</text><text x="199.33" y="67.00" class="mono" text-anchor="start">FRÅ BYGGJESETTET</text><text x="199.33" y="72.50" class="brod" text-anchor="start">· frontflatespegelen frå projektorhovudet</text><text x="199.33" y="77.10" class="brod" text-anchor="start">· telefonen (lykta)</text><text x="199.33" y="81.70" class="brod" text-anchor="start">· lupe, eller rund glaskule Ø 70 mm fylt med vatn</text><text x="199.33" y="90.80" class="mono" text-anchor="start">LAG SJØLV</text><text x="199.33" y="96.30" class="brod" text-anchor="start">· maske i svart papp, opning etter brennvidda</text><text x="199.33" y="100.90" class="brod" text-anchor="start">· trakt av papp med folie inni</text><text x="199.33" y="105.50" class="brod" text-anchor="start">· pappflik som spegelen vippar inn på</text><text x="199.33" y="110.10" class="brod" text-anchor="start">· halding for linsa 36 cm over bordet</text><line x1="12" y1="128" x2="285" y2="128" class="haar"/><text x="12.00" y="134.00" class="mono" text-anchor="start">REKKJEFØLGJE</text><text x="12.00" y="140.00" class="brod" text-anchor="start">1  Start 3D-printen av ribba til A. Ho printar medan du gjer resten.</text><text x="12.00" y="144.60" class="brod" text-anchor="start">2  Mål lobebreidda (side 2 og 3). Ho avgjer blendinga for A og B. Send tala før du byggjer vidare.</text><text x="12.00" y="149.20" class="brod" text-anchor="start">3  Byggj B. Det går fortast: plata, ramma, stolpen og telefonen.</text><text x="12.00" y="153.80" class="brod" text-anchor="start">4  Byggj A når ribba er ferdig.</text><text x="12.00" y="158.40" class="brod" text-anchor="start">5  Mål brennvidda på lupa eller kula (side 8), skjer maska og byggj C.</text><text x="12.00" y="163.00" class="brod" text-anchor="start">6  Fotografer etter fotolista, same kamera og eksponering for alle tre.</text><text x="164.88" y="134.00" class="mono" text-anchor="start">TRYGGLEIK</text><text x="164.88" y="140.00" class="brod" text-anchor="start">Overheadprojektoren skal ikkje koplast til straum. Fjern nettleidningane i stolpen.</text><text x="164.88" y="144.60" class="brod" text-anchor="start">Fresnelplata, blanke hole former og ei vassfylt kule samlar sollys og kan tenne papp.</text><text x="164.88" y="149.20" class="brod" text-anchor="start">Aldri i sol eller ved vindauge. Lagre dei tildekte.</text><text x="164.88" y="153.80" class="brod" text-anchor="start">Frontflatespegelen: ikkje ta på flata, ikkje tørk av. Støv med mjuk pensel.</text><text x="164.88" y="158.40" class="brod" text-anchor="start">Klipt folie og tynn plate har skarpe kantar.</text><text x="12.00" y="186.00" class="liten" text-anchor="start">Måla er frå lysmodellen (konsept/tre/tre.py og konsept/reflektor). Vinklane er rekna frå same posisjonar. Modellen er ikkje målt.</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">LOBEBREIDDA</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 2 av 10</text><text x="12.00" y="30.00" class="tittel" text-anchor="start">Mål lobebreidda først</text><text x="12.00" y="38.00" class="ingress" text-anchor="start">Ho avgjer om A og B held blendingskravet F1. Modellen reknar 2,5° for blank folie og 10° for satin.</text><text x="12.00" y="50.00" class="mono" text-anchor="start">SETT OVANFRÅ, IKKJE I MÅLESTOKK</text><line x1="66" y1="96" x2="98" y2="96" stroke="#000" stroke-width="1.2"/><text x="82.00" y="102.00" class="mono" text-anchor="middle">prøva</text><line x1="50.9" y1="64.9" x2="82" y2="96" class="straale"/><line x1="82" y1="96" x2="103.2" y2="74.8" class="straale"/><circle cx="50.9" cy="64.9" r="2" fill="#000"/><text x="46.89" y="65.89" class="mono" text-anchor="end">telefonlykta</text><line x1="96.8" y1="68.4" x2="109.6" y2="81.2" stroke="#000" stroke-width="1.2"/><text x="112.21" y="71.79" class="mono" text-anchor="start">målekortet (side 3)</text><line x1="82" y1="96" x2="82" y2="62" class="hjelp"/><text x="74.00" y="84.00" class="mono" text-anchor="middle">45°</text><text x="90.00" y="84.00" class="mono" text-anchor="middle">45°</text><text x="62.44" y="83.44" class="mono" text-anchor="end">1 m</text><text x="97.61" y="89.39" class="mono" text-anchor="start">d = 50 cm</text><text x="162.00" y="50.00" class="mono" text-anchor="start">SLIK GJER DU</text><text x="162.00" y="56.00" class="brod" text-anchor="start">1  Mørkt rom. Telefonlykta 1 m frå prøva, lyset inn på 45°.</text><text x="162.00" y="60.60" class="brod" text-anchor="start">2  Målekortet 50 cm frå prøva, vinkelrett på den speglande strålen.</text><text x="162.00" y="65.20" class="brod" text-anchor="start">3  Sikt midten av flekken på krossen.</text><text x="162.00" y="69.80" class="brod" text-anchor="start">4  Les av diameteren D der flekken er halvparten så lys som midten.</text><text x="162.00" y="74.40" class="brod" text-anchor="start">     Ta eit foto rett framfrå med låst eksponering og kvitbalanse.</text><text x="162.00" y="79.00" class="brod" text-anchor="start">5  Rekn σ = 0,48 · D, med D i cm og σ i grader (σ ≈ 24 · D / d).</text><text x="162.00" y="83.60" class="brod" text-anchor="start">6  Send tabellen og bileta, så blir tala lagde inn i modellen.</text><text x="162.00" y="92.00" class="liten" text-anchor="start">Referansar: blank folie 2,5° gjev D ≈ 5 cm. Satin 10° gjev D ≈ 21 cm (bruk A3-kortet).</text><text x="162.00" y="97.00" class="liten" text-anchor="start">Ligg folie på papp på 4 til 6°, ser auget frå 25 cm 1600 til 9000 cd/m² i spegelskivene.</text><text x="12.00" y="114.00" class="mono" text-anchor="start">PRØVE</text><text x="104.00" y="114.00" class="mono" text-anchor="start">D, CM</text><text x="134.00" y="114.00" class="mono" text-anchor="start">σ = 0,48 · D</text><text x="172.00" y="114.00" class="mono" text-anchor="start">FOTO NR.</text><text x="197.00" y="114.00" class="mono" text-anchor="start">MERKNAD</text><line x1="12" y1="124.2" x2="285" y2="124.2" class="haar"/><text x="12.00" y="122.00" class="brod" text-anchor="start">1  folie på papp, blank side</text><line x1="12" y1="131.4" x2="285" y2="131.4" class="haar"/><text x="12.00" y="129.20" class="brod" text-anchor="start">2  folie på papp, matt side</text><line x1="12" y1="138.6" x2="285" y2="138.6" class="haar"/><text x="12.00" y="136.40" class="brod" text-anchor="start">3  reflektorfilm frå LCD-skjermen</text><line x1="12" y1="145.8" x2="285" y2="145.8" class="haar"/><text x="12.00" y="143.60" class="brod" text-anchor="start">4  frontflatespegelen</text><line x1="12" y1="153.0" x2="285" y2="153.0" class="haar"/><text x="12.00" y="150.80" class="brod" text-anchor="start">5  fresnelplata utan ark</text><line x1="12" y1="160.2" x2="285" y2="160.2" class="haar"/><text x="12.00" y="158.00" class="brod" text-anchor="start">6  fresnelplata, eitt diffusorark</text><line x1="12" y1="167.4" x2="285" y2="167.4" class="haar"/><text x="12.00" y="165.20" class="brod" text-anchor="start">7  fresnelplata, to diffusorark</text><line x1="12" y1="174.6" x2="285" y2="174.6" class="haar"/><text x="12.00" y="172.40" class="brod" text-anchor="start">8  bakepapir oppå folie</text><line x1="12" y1="181.8" x2="285" y2="181.8" class="haar"/><text x="12.00" y="179.60" class="brod" text-anchor="start">9  kvitt papir (referanse)</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">MÅLEKORTET</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i fakti ="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 4 av 10</text><text x="12.00" y="30.00" class="tittel" text-anchor="start">A Skiva: plassering og bygging</text><text x="12.00" y="38.00" class="ingress" text-anchor="start">Ei kjelde i foten lyser opp på ei bøygd spegelskive. Skiva vippar lyset frå veggen bak skjermen ned på arbeidsfeltet.</text><text x="12.00" y="50.00" class="mono" text-anchor="start">MÅL FRÅ MODELLEN</text><text x="12.00" y="56.00" class="brod" text-anchor="start">Foten: 47 cm til høgre for skjermmidten, 7 cm framfor skjermplanet.</text><text x="12.00" y="60.60" class="brod" text-anchor="start">Lykta: 5 cm over bordet i papprullet, peikar opp mot midten av skiva.</text><text x="12.00" y="65.20" class="brod" text-anchor="start">Stolpen: 1,5 cm framfor skjermplanet. Ein arm held skiva 13,5 cm framfor stolpen.</text><text x="12.00" y="69.80" class="brod" text-anchor="start">Skiva: midten 41 cm over bordet og 15 cm framfor skjermplanet, rett over lykta.</text><text x="12.00" y="74.40" class="brod" text-anchor="start">Spegelsida er kuv: ho bular ut mot lykta, 6,5 mm på 250 mm.</text><text x="12.00" y="79.00" class="brod" text-anchor="start">Stemning: sikt flekken midt på veggen bak skjermen, 45 cm over bordet. Skiva om lag 52° mot vassrett.</text><text x="12.00" y="83.60" class="brod" text-anchor="start">Arbeid: sikt flekken 10 cm til venstre for feltmidten. Skiva om lag 28° mot vassrett.</text><text x="12.00" y="88.20" class="brod" text-anchor="start">Mellom dei dreier skiva om lag 33°. Sikt etter flekken, ikkje etter gradene.</text><text x="175.80" y="50.00" class="mono" text-anchor="start">BYGGING</text><text x="175.80" y="56.00" class="brod" text-anchor="start">1  Skjer skiva i papp etter malen (to halvdelar på A4,</text><text x="175.80" y="60.60" class="brod" text-anchor="start">     éin heil på A3).</text><text x="175.80" y="65.20" class="brod" text-anchor="start">2  Lim glatt aluminiumsfolie på, blank side ut, utan krøll.</text><text x="175.80" y="69.80" class="brod" text-anchor="start">     Har du reflektorfilm frå LCD-skjermen, bruk han.</text><text x="175.80" y="74.40" class="brod" text-anchor="start">3  Teip ribba bak, midt på og på tvers av kastet.</text><text x="175.80" y="79.00" class="brod" text-anchor="start">     Skiva tek bogen.</text><text x="175.80" y="83.60" class="brod" text-anchor="start">4  Rull papprullet rundt eit Ø 25 mm skaft og lim.</text><text x="175.80" y="88.20" class="brod" text-anchor="start">     Svart side inn.</text><text x="175.80" y="92.80" class="brod" text-anchor="start">5  Set telefonen på klossen med lykta opp i rullet.</text><text x="175.80" y="97.40" class="brod" text-anchor="start">6  Fest armen på stolpen og skiva på armen.</text><text x="175.80" y="102.00" class="brod" text-anchor="start">7  Føreseiing: med bogen er lågaste rute over 0,5 av</text><text x="175.80" y="106.60" class="brod" text-anchor="start">     snittet, flat skive under 0,45.</text><rect x="30.00" y="100.00" width="100.00" height="86.54" class="kutt"/><line x1="30.00" y1= tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 7 av 10</text><text x="12.00" y="30.00" class="tittel" text-anchor="start">B Over: plassering, bygging og mal</text><text x="12.00" y="38.00" class="ingress" text-anchor="start">Fresnelplata ligg over skjermkanten og vippar lyset frå veggen bak skjermen ned på bordet.</text><text x="12.00" y="50.00" class="mono" text-anchor="start">MÅL FRÅ MODELLEN</text><text x="12.00" y="56.00" class="brod" text-anchor="start">Plata: midten 62 cm over bordet, 20 cm over skjermkanten, midt framfor brukaren,</text><text x="12.00" y="60.60" class="brod" text-anchor="start">     9 cm framfor skjermplanet. Hengsel langs bakkanten.</text><text x="12.00" y="65.20" class="brod" text-anchor="start">Lykta: 12 cm under plata, om lag 51 cm over bordet og 4 cm framfor skjermplanet.</text><text x="12.00" y="69.80" class="brod" text-anchor="start">     Det er 8 til 9 cm over skjermkanten: set telefonen på ein kloss.</text><text x="12.00" y="74.40" class="brod" text-anchor="start">     Lykta peikar opp mot midten av plata.</text><text x="12.00" y="79.00" class="brod" text-anchor="start">Stemning: sikt veggen bak skjermen, 60 cm over bordet. Plata om lag 55° mot vassrett.</text><text x="12.00" y="83.60" class="brod" text-anchor="start">Arbeid: sikt feltmidten. Plata om lag 7°, nesten vassrett.</text><text x="12.00" y="88.20" class="brod" text-anchor="start">Brønnen må skjerme ved 50°. Med 64° ser auget dioden frå 60 cm.</text><text x="175.80" y="50.00" class="mono" text-anchor="start">BYGGING</text><text x="175.80" y="56.00" class="brod" text-anchor="start">1  Skjer fire pappstrimlar, 20 mm breie:</text><text x="175.80" y="60.60" class="brod" text-anchor="start">     2 × 315 mm og 2 × 275 mm.</text><text x="175.80" y="65.20" class="brod" text-anchor="start">2  Teip dei på kanten av plata, 5 mm inn på plata.</text><text x="175.80" y="69.80" class="brod" text-anchor="start">     Rør ikkje rillene.</text><text x="175.80" y="74.40" class="brod" text-anchor="start">3  Teip eit hengsel langs bakkanten til tverrstykket</text><text x="175.80" y="79.00" class="brod" text-anchor="start">     på stolpen, og klem stolpen bak skjermen.</text><text x="175.80" y="83.60" class="brod" text-anchor="start">4  Rull brønnen (malen under) og set han rundt lykta.</text><text x="175.80" y="88.20" class="brod" text-anchor="start">5  Prøv utan ark, med eitt og med to diffusorark.</text><text x="175.80" y="92.80" class="brod" text-anchor="start">6  Føreseiing: jamnheit 0,46 (0,35 til 0,55) med ark,</text><text x="175.80" y="97.40" class="brod" text-anchor="start">     under 0,05 utan.</text><rect x="30.00" y="112.00" width="86.54" height="10.49" class="kutt"/><line x1="108.54" y1="112.00" x2="108.54" y2="122.49" class="fald"/><line x1="30.00" y1="126.49" x2="116.54" y2="126.49" class="maal"/><line x1="30.00" y1="124.89" x2="30.00" y2="128.09" class="maal"/><line x1="116.54" y1="124.89" x2="116.54" y2="128.09" class="maal"/><text transform="translate(73.27,130.69) rotate(0.0)" class="mono" text-anchor="middle">86,5 mm</text><line x1="26.00" y1="112.00" x2="26.00" y2="122.49" class="maal"/><line x1="27.60" y1="112.00" x2="24.40" y2="112.00" class="maal"/><line x1="27.60" y1="122.49" x2="24.40" y2="122.49" class="maal"/><text x="27.20" y="118.24" class="mono" text-anchor="end">10,5 mm</text><text x="30.00" y="104.50" class="mono" text-anchor="start">BRØNN · krage Ø 25 mm, 10,5 mm høg, svart papp</text><text x="30.00" y="108.30" class="mono" text-anchor="start">gjev avskjerming ved 50° frå aksen</text><text x="142.00" y="106.00" class="mono" text-anchor="start">RAMMA, SETT FRAMFRÅ (1:5)</text><rect x="142.00" y="110.00" width="63.00" height="63.00" class="tynn"/><rect x="146.00" y="114.00" width="55.00" height="55.00" class="tynn"/><rect x="145.00" y="113.00" width="57.00" height="57.00" fill="none" stroke="#9a9a9a" stroke-dasharray="1 1" stroke-width="0.2"/><text x="209.00" y="118.00" class="mono grå" text-anchor="start">ytre 315 × 315 mm</text><text x="209.00" y="123.00" class="mono grå" text-anchor="start">opning 275 × 275 mm</text><text x="209.00" y="128.00" class="mono grå" text-anchor="start">stipla: plata 285 × 285 mm</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">C VINDAUGE</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="194" y1="195.6" x2="194" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="204" y1="195.6" x2="204" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="214" y1="195.6" x2="214" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="224" y1="195.6" x2="224" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="234" y1="195.6" x2="234" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="244" y1="195.6" x2="244" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="254" y1="195.6" x2="254" y2="196.8" stroke="#000" stroke-width="0.2"/><text x="285.00" y="198.00" class="mono" text-anchor="end">side 8 av 10</text><text x="12.00" y="30.00" class="tittel" text-anchor="start">C Vindauge: brennvidd, maske og plassering</text><text x="12.00" y="38.00" class="ingress" text-anchor="start">Ei linse teiknar eit vindauge av lys på veggen. Ein spegel glir inn i strålen og legg feltet på bordet, medan vindauget blir.</text><text x="12.00" y="50.00" class="mono" text-anchor="start">MÅL BRENNVIDDA FØRST</text><text x="12.00" y="56.00" class="brod" text-anchor="start">Avbild eit vindauge eller ei lampe i andre enden av rommet på eit kvitt ark.</text><text x="12.00" y="60.60" class="brod" text-anchor="start">Avstanden frå linsa til arket når biletet er skarpt, er om lag f.</text><text x="12.00" y="65.20" class="brod" text-anchor="start">For glaskula: mål frå midten av kula. Ei vassfylt kule på Ø 70 mm har f om lag 70 mm.</text><text x="12.00" y="74.00" class="mono" text-anchor="start">MASKA ETTER BRENNVIDDA · feltet 60 × 40 cm, 61 cm frå linsa</text><text x="12.00" y="80.00" class="mono grå" text-anchor="start">f, mm</text><text x="34.00" y="80.00" class="mono grå" text-anchor="start">maske til linse, mm</text><text x="76.00" y="80.00" class="mono grå" text-anchor="start">opning, mm</text><text x="12.00" y="85.50" class="brod" text-anchor="start">50</text><text x="34.00" y="85.50" class="brod" text-anchor="start">54</text><text x="76.00" y="85.50" class="brod" text-anchor="start">53 × 36</text><text x="12.00" y="91.00" class="brod" text-anchor="start">60</text><text x="34.00" y="91.00" class="brod" text-anchor="start">67</text><text x="76.00" y="91.00" class="brod" text-anchor="start">65 × 44</text><text x="12.00" y="96.50" class="brod svart" text-anchor="start">70</text><text x="34.00" y="96.50" class="brod svart" text-anchor="start">79</text><text x="76.00" y="96.50" class="brod svart" text-anchor="start">78 × 52</text><text x="12.00" y="102.00" class="brod" text-anchor="start">80</text><text x="34.00" y="102.00" class="brod" text-anchor="start">92</text><text x="76.00" y="102.00" class="brod" text-anchor="start">90 × 60</text><text x="12.00" y="107.50" class="brod" text-anchor="start">100</text><text x="34.00" y="107.50" class="brod" text-anchor="start">120</text><text x="76.00" y="107.50" class="brod" text-anchor="start">117 × 78</text><text x="12.00" y="119.00" class="liten" text-anchor="start">Maska er eit rektangel her. Drei og trim ho til hjørna treffer feltet.</text><text x="164.88" y="50.00" class="mono" text-anchor="start">MÅL FRÅ MODELLEN</text><text x="164.88" y="56.00" class="brod" text-anchor="start">Linsehovudet: 36 cm over bordet, 47 cm til høgre for skjermmidten,</text><text x="164.88" y="60.60" class="brod" text-anchor="start">     5 cm framfor skjermplanet.</text><text x="164.88" y="65.20" class="brod" text-anchor="start">Utan spegel: sikt midt på veggen bak skjermen, 42 cm over bordet (56 cm unna).</text><text x="164.88" y="69.80" class="brod" text-anchor="start">Spegelen inne: om lag 3/4 av strålen går ned på feltmidten (61 cm unna).</text><text x="164.88" y="74.40" class="brod" text-anchor="start">Strålen bøyer om lag 63° mellom vegg og felt.</text><text x="164.88" y="86.00" class="mono" text-anchor="start">BYGGING</text><text x="164.88" y="92.00" class="brod" text-anchor="start">1  Skjer maska i svart papp (mal for f = 70 mm på side 9).</text><text x="164.88" y="96.60" class="brod" text-anchor="start">2  Fald trakta (side 10), folie inni, mellom lykta og maska.</text><text x="164.88" y="101.20" class="brod" text-anchor="start">3  Set linsa i avstanden frå tabellen bak maska.</text><text x="164.88" y="105.80" class="brod" text-anchor="start">4  Pappflik med frontflatespegelen rett etter linsa.</text><text x="164.88" y="110.40" class="brod" text-anchor="start">     Flika vippar inn og dekkjer om lag 3/4 av strålen.</text><text x="164.88" y="115.00" class="brod" text-anchor="start">5  Føreseiing: vindauget står i ro medan feltet kjem fram,</text><text x="164.88" y="119.60" class="brod" text-anchor="start">     og skjermen får under 0,15 av feltet heile vegen.</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">C VINDAUGE, MASKE</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199"  x="169.63" y="50.00" class="mono" text-anchor="start">SPEGELFLIKA</text><text x="169.63" y="56.00" class="brod" text-anchor="start">Teip frontflatespegelen på ein pappflik som er 10 mm større</text><text x="169.63" y="60.60" class="brod" text-anchor="start">enn spegelen. Ta berre på kantane. Fald flika i eit papphengsel</text><text x="169.63" y="65.20" class="brod" text-anchor="start">rett etter linsa, så ho kan vippast inn i strålen.</text><text x="169.63" y="69.80" class="brod" text-anchor="start">Inne skal flika dekkje om lag 3/4 av strålen.</text><text x="169.63" y="82.00" class="mono" text-anchor="start">LINSA</text><text x="169.63" y="88.00" class="brod" text-anchor="start">Glaskula kviler i ein ring av papp. Lupa i eit spor i papp.</text><text x="169.63" y="92.60" class="brod" text-anchor="start">Mål avstanden til maska frå midten av kula eller frå lupa.</text></svg></section><section class="ark" style="width:297mm;height:210mm"><svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="297" height="210" fill="#fff"/><text x="12.00" y="12.00" class="mono" text-anchor="start">GK5 · NORTHERN · BYGGJEPAKKE</text><text x="148.50" y="12.00" class="mono svart" text-anchor="middle">C VINDAUGE, TRAKT</text><text x="285.00" y="12.00" class="mono" text-anchor="end">IVER R. FINNE · 13.11.2026</text><line x1="12" y1="14.5" x2="285" y2="14.5" class="strek"/><line x1="12" y1="192" x2="285" y2="192" class="haar"/><text x="12.00" y="198.00" class="mono" text-anchor="start">Skriv ut i faktisk storleik (100 %), ikkje «tilpass til side». Kontrollstrek 100 mm:</text><line x1="164" y1="196.8" x2="264" y2="196.8" stroke="#000" stroke-width="0.35"/><line x1="164" y1="194.6" x2="164" y2="199" stroke="#000" stroke-width="0.35"/><line x1="264" y1="194.6" x2="264" y2="199" stroke="#000" stroke-width="0.35"/><line x1="174" y1="195.6" x2="174" y2="196.8" stroke="#000" stroke-width="0.2"/><line x1="184" y1="195.6" x2="184" y2="196.
