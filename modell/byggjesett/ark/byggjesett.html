<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<title>Byggjesettet i 3D</title>
<link rel="stylesheet" href="../../../leveransar/01_fase1_v2/felles.css">
<style>
  .rad { display: flex; gap: 26px; align-items: flex-start; }
  .del .hylle { display: flex; align-items: flex-end; }
  .del img { display: block; }
  .del figcaption { margin-top: 7px; line-height: 1.35; }
  .skala { margin-left: auto; }
  .skala .strek { height: 6px; border: 1px solid #F4F4F4; border-top: 0; }
</style>
</head>
<body>
<div class="side">
  <header class="topp">
    <span>GK5 · Northern · byggjesett</span>
    <span>Byggjesettet i 3D</span>
    <span>Iver R. Finne · 13.11.2026</span>
  </header>

  <h1 class="tittel">Ni delar i same målestokk, klare til skisser.</h1>

  <main class="innhald" style="display: block;">
    <div class="rad" style="margin-top:0px">
      <figure class="del" style="width:291.7px">
        <div class="hylle" style="height:365.1px"><img src="../render/del-samla.png" alt="" style="width:291.7px;height:302.4px"></div>
        <figcaption><b>Projektoren samla</b><br>rekonstruksjon frå delane<br>ikkje målt</figcaption>
      </figure>
      <figure class="del" style="width:259.6px">
        <div class="hylle" style="height:365.1px"><img src="../render/del-P05.png" alt="" style="width:259.6px;height:125.8px"></div>
        <figcaption><b>P05 fresnelspegel</b><br>vindauge 285 · f 187<br>deleliste<br><b>aldri i sol</b></figcaption>
      </figure>
      <figure class="del" style="width:181.6px">
        <div class="hylle" style="height:365.1px"><img src="../render/del-P04.png" alt="" style="width:181.6px;height:89.3px"></div>
        <figcaption><b>P04 base</b><br>285 × 99 × 28<br>inntil ± 12<br><b>230 V: aldri kople til</b></figcaption>
      </figure>
      <figure class="del" style="width:188.5px">
        <div class="hylle" style="height:365.1px"><img src="../render/del-P08.png" alt="" style="width:188.5px;height:365.1px"></div>
        <figcaption><b>P08 prismeark</b><br>306 × 535 × 0,2<br>inntil ± 70<br>frå monitoren, berre form</figcaption>
      </figure>
    </div>
    <div class="rad" style="margin-top:22px">
      <figure class="del" style="width:177.7px">
        <div class="hylle" style="height:86.9px"><img src="../render/del-P01.png" alt="" style="width:177.7px;height:86.9px"></div>
        <figcaption><b>P01 arm</b><br>240 × 43 × 26<br>inntil ± 12</figcaption>
      </figure>
      <figure class="del" style="width:128.0px">
        <div class="hylle" style="height:86.9px"><img src="../render/del-P03.png" alt="" style="width:97.3px;height:86.9px"></div>
        <figcaption><b>P03 hovud</b><br>140 × 78 × 80<br>inntil ± 20<br>vifte 60, typeskilt</figcaption>
      </figure>
      <figure class="del" style="width:128.0px">
        <div class="hylle" style="height:86.9px"><img src="../render/del-P02.png" alt="" style="width:70.2px;height:65.7px"></div>
        <figcaption><b>P02 hengsel</b><br>84 × 66 × 55<br>inntil ± 15</figcaption>
      </figure>
      <figure class="del" style="width:128.0px">
        <div class="hylle" style="height:86.9px"><img src="../render/del-P07.png" alt="" style="width:57.4px;height:39.2px"></div>
        <figcaption><b>P07 projeksjonslinse</b><br>Ø 77 × 28 · f ≈ 280<br>inntil ± 10<br><b>aldri i sol</b></figcaption>
      </figure>
      <figure class="del" style="width:128.0px">
        <div class="hylle" style="height:86.9px"><img src="../render/del-P06.png" alt="" style="width:29.3px;height:19.3px"></div>
        <figcaption><b>P06 glaslinse</b><br>Ø 41 × 14<br>inntil ± 6<br><b>aldri i sol</b></figcaption>
      </figure>
      <figure class="del" style="width:128.0px">
        <div class="hylle" style="height:86.9px"><img src="../render/del-P09.png" alt="" style="width:18.4px;height:51.2px"></div>
        <figcaption><b>P09 FSX-pære</b><br>Ø 20 × 77<br>deleliste</figcaption>
      </figure>
      <figure class="del skala" style="width:62.3px">
        <div class="hylle" style="height:86.9px"><div class="strek" style="width:62.3px"></div></div>
        <figcaption><b>100 mm</b></figcaption>
      </figure>
    </div>
  </main>

  <footer class="botn">
    <span>Mål i mm. Delelista til 3M 2000 og typeskiltet på vifta gjev dei sikre måla, resten er anslått frå foto 13.11.2026.</span>
    <span>Ingenting er målt med linjal enno.</span>
  </footer>
</div>
</body>
</html>
